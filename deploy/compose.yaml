name: edu-agent
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: edu_agent
      POSTGRES_USER: edu_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu_agent -d edu_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-internal
    restart: unless-stopped

  nocturne-postgres:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    environment:
      POSTGRES_DB: ${NOCTURNE_POSTGRES_DB:-nocturne}
      POSTGRES_USER: ${NOCTURNE_POSTGRES_USER:-nocturne}
      POSTGRES_PASSWORD: ${NOCTURNE_POSTGRES_PASSWORD:?set a distinct NOCTURNE_POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes:
      - nocturne-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - nocturne-internal
    restart: unless-stopped

  nocturne:
    # Supply an imported OCI reference or registry reference pinned to the
    # platform-manifest digest verified by deploy/nocturne/image.lock.json.
    image: ${NOCTURNE_IMAGE:?set NOCTURNE_IMAGE to repository@sha256 digest in .env}
    init: true
    depends_on:
      nocturne-postgres:
        condition: service_healthy
    expose:
      - "8233"
    environment:
      HOST: 0.0.0.0
      WEB_PORT: "8233"
      AUTO_OPEN_BROWSER: "false"
      DATABASE_URL: postgresql+asyncpg://${NOCTURNE_POSTGRES_USER:-nocturne}:${NOCTURNE_POSTGRES_PASSWORD:?set NOCTURNE_POSTGRES_PASSWORD}@nocturne-postgres:5432/${NOCTURNE_POSTGRES_DB:-nocturne}?ssl=disable
      VALID_DOMAINS: core
      CORE_MEMORY_URIS__edu-agent: core://edu-agent
      API_TOKEN: ${NOCTURNE_BRIDGE_API_TOKEN:?set NOCTURNE_BRIDGE_API_TOKEN in .env}
      EDU_AGENT_MAINTENANCE_TOKEN: ${NOCTURNE_MAINTENANCE_TOKEN:?set NOCTURNE_MAINTENANCE_TOKEN in .env}
      EDU_AGENT_SERVER_INTERNAL_URL: http://server:8080
      EDU_AGENT_SERVER_MAINTENANCE_TOKEN: ${NOCTURNE_MAINTENANCE_TOKEN:?set NOCTURNE_MAINTENANCE_TOKEN in .env}
      EDU_AGENT_BACKUP_ROOT: /app/backups
      SNAPSHOT_DIR: /app/snapshots
    volumes:
      - nocturne-backups:/app/backups
      - nocturne-snapshots:/app/snapshots
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8233/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - nocturne-internal
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: http://127.0.0.1:${SERVER_PORT:-8080}
      ALLOW_INSECURE_NON_LOOPBACK: "true"
      ADMIN_UI_ENABLED: ${ADMIN_UI_ENABLED:-false}
      ADMIN_UI_TOKEN: ${ADMIN_UI_TOKEN:-}
      ADMIN_UI_SETTINGS_FILE: /var/lib/edu-agent/private/admin-settings.json
      NOTESYNC_ALLOW_INSECURE_NON_LOOPBACK: ${NOTESYNC_ALLOW_INSECURE_NON_LOOPBACK:-false}
      # The published host port above is loopback-only; the container listener itself is not.
      ADMIN_UI_TRUSTED_LOOPBACK_PROXY: "true"
      DATABASE_URL: postgres://edu_agent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/edu_agent?sslmode=disable
      MIGRATE_ON_START: "true"
      SHUTDOWN_TIMEOUT: 10s
      PAIRING_CODE_TTL: 10m
      PAIRING_CODE_MAX_ATTEMPTS: "5"
      PAIRING_RATE_LIMIT_PER_MINUTE: "10"
      AUTH_FAILURE_LIMIT_PER_MINUTE: "20"
      DEVICE_RATE_LIMIT_PER_MINUTE: "600"
      TOKEN_LAST_USED_TOUCH_INTERVAL: 5m
      MODEL_REQUIRED: ${MODEL_REQUIRED:-false}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_CONTEXT_WINDOW: ${MODEL_CONTEXT_WINDOW:-}
      MODEL_MIN_CONTEXT_WINDOW: "4096"
      MODEL_TIMEOUT: 30s
      MODEL_PROBE_CACHE_TTL: 15m
      OFFLINE_SIGNER_KEY_ID: ${OFFLINE_SIGNER_KEY_ID:?set OFFLINE_SIGNER_KEY_ID in .env}
      OFFLINE_SIGNER_PRIVATE_KEY: ${OFFLINE_SIGNER_PRIVATE_KEY:?set a canonical 64-byte Ed25519 private key in .env}
      OFFLINE_SIGNER_ISSUED_AT: ${OFFLINE_SIGNER_ISSUED_AT:?set a UTC RFC3339 issue time in .env}
      OFFLINE_SIGNER_NOT_AFTER: ${OFFLINE_SIGNER_NOT_AFTER:?set a later UTC RFC3339 expiry in .env}
      NOCTURNE_ENABLED: "true"
      NOCTURNE_BASE_URL: http://nocturne:8233
      NOCTURNE_API_TOKEN: ${NOCTURNE_BRIDGE_API_TOKEN:?set NOCTURNE_BRIDGE_API_TOKEN in .env}
      NOCTURNE_MAINTENANCE_TOKEN: ${NOCTURNE_MAINTENANCE_TOKEN:?set NOCTURNE_MAINTENANCE_TOKEN in .env}
      NOCTURNE_NAMESPACE: edu-agent
      NOCTURNE_DOMAIN: core
      NOCTURNE_HTTP_TIMEOUT: 10s
      NOCTURNE_RECONCILIATION_INTERVAL: 30s
      NOCTURNE_WORKER_POLL_INTERVAL: 1s
      NOCTURNE_WORKER_LEASE_DURATION: 2m
      NOCTURNE_WORKER_BATCH_SIZE: "50"
      NOCTURNE_DELIVERY_TTL: 24h
      NOCTURNE_CANDIDATE_SWEEP_INTERVAL: 5m
      NOCTURNE_DELIVERY_SWEEP_INTERVAL: 5m
      NOCTURNE_BACKUP_ROOT: /var/lib/edu-agent/nocturne-backups
      NOCTURNE_BACKUP_CONTROLLER_INTERVAL: ${NOCTURNE_BACKUP_CONTROLLER_INTERVAL:-24h}
      NOCTURNE_BACKUP_RETENTION: ${NOCTURNE_BACKUP_RETENTION:-720h}
      NOCTURNE_BACKUP_MASTER_WRAPPING_KEY: ${NOCTURNE_BACKUP_MASTER_WRAPPING_KEY:?set a canonical 32-byte base64url key in .env}
      NOCTURNE_PG_DUMP_DSN: postgres://${NOCTURNE_POSTGRES_USER:-nocturne}:${NOCTURNE_POSTGRES_PASSWORD:?set NOCTURNE_POSTGRES_PASSWORD}@nocturne-postgres:5432/${NOCTURNE_POSTGRES_DB:-nocturne}?sslmode=disable
      NOCTURNE_IMAGE_LOCK_REFERENCE: ${NOCTURNE_IMAGE:?set NOCTURNE_IMAGE to repository@sha256 digest in .env}
      PRIVACY_ERASURE_GRANT_TTL: 10m
      PRIVACY_ERASURE_GRANT_MAX_ATTEMPTS: "5"
      PRIVACY_OFFLINE_CHALLENGE_KEYS: ${PRIVACY_OFFLINE_CHALLENGE_KEYS:?set versioned canonical 32-byte base64url privacy challenge keys in .env}
    volumes:
      - nocturne-backups:/var/lib/edu-agent/nocturne-backups
      - server-admin-settings:/var/lib/edu-agent
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app-internal
      - nocturne-internal
    restart: unless-stopped

volumes:
  postgres-data:
  nocturne-postgres-data:
  nocturne-backups:
  nocturne-snapshots:
  server-admin-settings:

networks:
  app-internal:
  nocturne-internal:
    internal: true
