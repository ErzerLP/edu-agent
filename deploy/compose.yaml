name: edu-agent
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edu_agent
      POSTGRES_USER: edu_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu_agent -d edu_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      PUBLIC_BASE_URL: http://127.0.0.1:${SERVER_PORT:-8080}
      ALLOW_INSECURE_NON_LOOPBACK: "true"
      DATABASE_URL: postgres://edu_agent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/edu_agent?sslmode=disable
      MIGRATE_ON_START: "true"
      SHUTDOWN_TIMEOUT: 10s
      PAIRING_CODE_TTL: 10m
      PAIRING_CODE_MAX_ATTEMPTS: "5"
      PAIRING_RATE_LIMIT_PER_MINUTE: "10"
      AUTH_FAILURE_LIMIT_PER_MINUTE: "20"
      DEVICE_RATE_LIMIT_PER_MINUTE: "600"
      TOKEN_LAST_USED_TOUCH_INTERVAL: 5m
      MODEL_REQUIRED: ${MODEL_REQUIRED:-false}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_CONTEXT_WINDOW: ${MODEL_CONTEXT_WINDOW:-}
      MODEL_MIN_CONTEXT_WINDOW: "4096"
      MODEL_TIMEOUT: 30s
      MODEL_PROBE_CACHE_TTL: 15m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
