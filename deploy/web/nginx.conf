# 将域名与证书路径替换为实际配置；Go 仅监听 127.0.0.1:8080。
server {
    listen 443 ssl;
    server_name learn.example;
    ssl_certificate /etc/nginx/certs/learn.example.crt;
    ssl_certificate_key /etc/nginx/certs/learn.example.key;

    # 公网只转发本次已经交付的学习入口，管理和内部协议不公开。
    location ~ ^/(?:app(?:/|$)|content/[^/]+$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }
    location ~ ^/v1/learning/runs/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }
    location ~ ^/v1/(?:web(?:/|$)|learning-spaces(?:/|$)|learning/(?:goals|runs|operations|content)(?:/|$)|tutoring/(?:sessions(?:/[^/]+(?:/(?:actions|content|operations/[^/]+))?)?|proposals)$|knowledge/(?:revisions/head|retrievals)$|settings(?:/|$)|capabilities$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }
    location / { return 404; }
}
