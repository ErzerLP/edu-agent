# 将域名与证书路径替换为实际配置；Go 仅监听 127.0.0.1:8080。
server {
    listen 443 ssl;
    server_name learn.example;
    ssl_certificate /etc/nginx/certs/learn.example.crt;
    ssl_certificate_key /etc/nginx/certs/learn.example.key;

    # 公网只转发本次已经交付的学习入口，管理和内部协议不公开。
    location ~ ^/(?:app(?:/|$)|content/[^/]+$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }
    location ~ ^/v1/learning/runs/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }
    location ~ ^/v1/knowledge/import-jobs(?:/[^/]+)?$ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }
    # 单批导入、来源/PDF 与冻结范围沿用正式审阅 API，不开放直接导入写入口。
    location ~ ^/v1/knowledge/(?:imports/(?:previews|confirm|operations/[^/]+)|reference-sources|scopes/[^/]+(?:/export)?|revisions/[^/]+/documents/[^/]+/pages/[0-9]+)$ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    location ~ ^/v1/learning/(?:progress|reviews)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    # 本地连接的浏览器、配对与轮询入口；功能开关和双端授权仍由 Go 校验。
    location ~ ^/v1/companion/(?:browser|attach|channel)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    # 同步仅公开学习 API；连接设置仍在独立的本机管理入口。
    location ~ ^/v1/knowledge/notesync/(?:status|previews|reviews(?:/[^/]+(?:/(?:resolutions|resolution-previews))?)?|operations/[^/]+)$ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    # 知识结构与既有维护仍由 Go 校验学习区、来源和独立审批权限。
    location ~ ^/v1/knowledge/(?:structure(?:/(?:capabilities|concepts/[^/]+|proposals(?:/[^/]+(?:/decisions)?)?))?|maintenance/(?:proposals(?:/[^/]+(?:/(?:approve|reject))?)?|rollbacks)|revisions/[^/]+/(?:tree|export))$ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    location ~ ^/v1/(?:web(?:/|$)|learning-spaces(?:/|$)|learning/(?:goals|runs|operations|content|conversations)(?:/|$)|learning/(?:assessments(?:/[^/]+(?:/decisions)?)?|attempts/[^/]+/feedback|evidence-carryovers(?:/[^/]+(?:/(?:approve|reject))?)?)$|learning/(?:start|changes)/capabilities$|tutoring/(?:sessions(?:/[^/]+(?:/(?:actions|content|knowledge-context|operations/[^/]+))?)?|proposals)$|knowledge/(?:revisions/head|retrievals|collections)$|settings(?:/|$)|capabilities$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }
    # 记忆与隐私沿用原 scope、CSRF 和本机签发的一次性 grant，不开放管理面。
    location ~ ^/v1/(?:memory/(?:candidates(?:/[^/]+(?:/decisions)?)?|records(?:/[^/]+(?:/candidates)?)?|export|deliveries/[^/]+/replays)|privacy/(?:erasures(?:/[^/]+)?|operations/[^/]+)|devices(?:/[^/]+)?)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    location / { return 404; }
}
