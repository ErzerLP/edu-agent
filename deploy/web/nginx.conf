# 将域名与证书路径替换为实际配置；Go 仅监听 127.0.0.1:8080。
server {
    listen 443 ssl;
    server_name learn.example;
    ssl_certificate /etc/nginx/certs/learn.example.crt;
    ssl_certificate_key /etc/nginx/certs/learn.example.key;

    location = /v1/model-gateway/chat/completions {
        client_max_body_size 16m;
        client_body_timeout 30s;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_next_upstream off;
        proxy_read_timeout 910s;
        proxy_send_timeout 30s;
        send_timeout 5s;
        gzip off;
        access_log off;
        error_log /dev/null crit;
    }
    location ~ "^/v1/model-gateway/(?:config|requests/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:/cancel)?)$" {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_read_timeout 30s;
        proxy_cache off;
        proxy_next_upstream off;
        access_log off;
        error_log /dev/null crit;
    }

    # 公网只转发已交付的网页与 CLI 入口，管理和内部协议不公开。
    location ~ ^/(?:app(?:/|$)|content/[^/]+$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }
    location = /readyz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }
    location = /v1/pairings/exchange {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }
    location = /v1/model/capabilities {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }
    # Studio generations, quiz/start, quiz-operations and exercises (help/resume)
    # use the learning/studio allowlist with an explicit learning-space header.
    # Run citations are covered by the learning/runs allowlist below; never proxy an alternate source URL.
    location ~ ^/v1/learning/runs/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }
    location ~ ^/v1/knowledge/import-jobs(?:/[^/]+)?$ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }
    # 网页审阅与 CLI 导入、来源/PDF、冻结范围；写入权限仍由 Go 校验。
    location ~ ^/v1/knowledge/(?:imports(?:/(?:previews|confirm|operations/[^/]+))?|reference-sources|source-capabilities|source-discovery|sources(?:/[^/]+/documents/[^/]+)?|scopes(?:/[^/]+(?:/(?:tree|export))?)?|revisions/[^/]+/documents/[^/]+/pages/[0-9]+)$ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    location ~ ^/v1/learning/(?:progress|reviews|timeline|routes|nodes/[^/]+|evidence|projections/status|usage(?:/tasks(?:/[^/]+/calls)?)?)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    # CLI 离线打包、同步与审阅；设备授权和学习区仍由 Go 校验。
    location ~ ^/v1/learning/offline/(?:packs|sync|operations/[^/]+|assessments(?:/[^/]+(?:/decisions)?)?)$ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    # 本地连接的浏览器、配对与轮询入口；功能开关和双端授权仍由 Go 校验。
    location ~ ^/v1/companion/(?:browser|attach|channel)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    # 同步仅公开学习 API；连接设置仍在独立的本机管理入口。
    location ~ ^/v1/knowledge/notesync/(?:status|previews|reviews(?:/[^/]+(?:/(?:resolutions|resolution-previews))?)?|operations/[^/]+)$ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    # 知识结构与既有维护仍由 Go 校验学习区、来源和独立审批权限。
    location ~ ^/v1/knowledge/(?:structure(?:/(?:capabilities|concepts/[^/]+|proposals(?:/[^/]+(?:/decisions)?)?))?|maintenance/(?:proposals(?:/[^/]+(?:/(?:approve|reject))?)?|rollbacks)|revisions/[^/]+/(?:tree|export))$ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    location ~ ^/v1/(?:web(?:/|$)|learning-spaces(?:/|$)|learning/(?:goals|runs|operations|content|conversations|studio|exercises)(?:/|$)|learning/(?:assessments(?:/[^/]+(?:/decisions)?)?|attempts/[^/]+/feedback|evidence-carryovers(?:/[^/]+(?:/(?:approve|reject))?)?)$|learning/(?:start|changes)/capabilities$|tutoring/(?:sessions(?:/[^/]+(?:/(?:actions|content|knowledge-context|operations/[^/]+))?)?|proposals)$|knowledge/(?:revisions/head|retrievals|collections)$|settings(?:/|$)|capabilities$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }
    # 记忆与隐私沿用原 scope、CSRF 和本机签发的一次性 grant，不开放管理面。
    location ~ ^/v1/(?:memory/(?:candidates(?:/[^/]+(?:/decisions)?)?|records(?:/[^/]+(?:/candidates)?)?|export|deliveries/[^/]+/replays)|privacy/(?:erasures(?:/[^/]+(?:/offline-device-purge(?:/ack)?)?)?|operations/[^/]+)|devices(?:/[^/]+)?)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_cache off;
    }
    location / { return 404; }
}
