      实现模型调用契约。`transport/httpapi` 只完成 HTTP 映射。
    result: passed
    reason:
      text: identity 拥有身份数据和 Store 端口，postgresstore 是其适配器；platform/postgres
        仅负责连接，platform/outbox 只定义通用投递语义，LLM 与 HTTP 映射边界清楚。
      truncated: false
