    text: HTTP/OpenAPI 增加 `GET /v1/knowledge/revisions/head`、`POST
      /v1/knowledge/imports`、`GET
      /v1/knowledge/revisions/{revisionID}/tree`、`GET
      /v1/knowledge/revisions/{revisionID}/export` 和 `POST
      /v1/knowledge/retrievals`。export 返回按 canonical path 排序的 document 数组及
