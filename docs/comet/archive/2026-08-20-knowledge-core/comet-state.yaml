      canonical hash、tree、NodeID、NodeRevisionID 或 lineage。"
    result: passed
    reason:
      text: Versioned immutable node artifacts are stored and current-snapshot
        summaries are pinned.
      truncated: false
  - id: A38
    source: specs/knowledge-core/spec.md
    text: 检索命令包含查询、可选 knowledge revision ID、query context schema version 和有界
      limits。未指定 revision 时服务只读取一次 head 并立即冻结为本次 revision；后续所有候选、artifact 和 hit
      必须属于该 snapshot，禁止混入较新的 head。
    result: passed
    reason:
      text: Retrieval reads head once and confines artifacts, candidates and hits to
        the frozen revision.
      truncated: false
  - id: A39
    source: specs/knowledge-core/spec.md
    text: "`retriever-v1` 的 tokenization 与 identity policy 相同，但查询和字段使用 token
      set。字段命中值是 `1_000_000 * |query_tokens ∩ field_tokens| / |query_tokens|`
      的整数向下取整；空查询在校验阶段拒绝。document score 是 `4*path + 3*all_heading_titles +
      1*first_2048_byte_body_excerpt`，node score 是 `4*title + 2*ancestor_titles
      + 1*direct_child_titles + 1*first_2048_byte_local_body`。所有字段先按 UTF-8 rune
      边界截断；score 降序后按 stable revision ID 升序 tie-break。"
    result: passed
    reason:
      text: All lexical fields receive rune-safe 2048-byte truncation with UTF-8
        boundary tests.
      truncated: false
  - id: A40
    source: specs/knowledge-core/spec.md
    text: 服务取前 8 个 document 进入 document shortlist，即使全为零分也按 stable ID 补足。每个 parent 的
      children 全部评分后，候选集截断到前 20；lexical fallback 选择前三个正分候选，全为零时选择第一个。候选无
      children 时 action 为 `select`；有 children 且 local-body 命中为正时是
      `select_expand`；有 children 且 local-body 命中为零时是 `expand`；没有合法候选时是 `stop`。
    result: passed
    reason:
      text: Shortlist, candidate, fallback and action limits/rules are implemented.
      truncated: false
  - id: A41
    source: specs/knowledge-core/spec.md
    text: 遍历按 document shortlist 顺序进行稳定 breadth-first queue。领域层逐项应用
      decision：`expand`/`select_expand` 只把对应候选在当前 snapshot 的 children
      入队，`select`/`select_expand` 按首次 trace index 把该候选加入 hit，并按 NodeRevisionID
      去重；空 decision 终止当前 branch。深度 8、总候选 200 或 queue 为空时停止；最终 hit 按首次 trace
      index、深度、NodeRevisionID 排序并截断到 10。英文和数字通过 case-folded runs，CJK 额外加入相邻 rune
      bigram；实现不调用 PostgreSQL 英文全文分词，也不使用向量。
    result: passed
    reason:
      text: Complete shortlist global FIFO BFS, truncation and zero-score hit
        suppression are tested.
      truncated: false
  - id: A42
    source: specs/knowledge-core/spec.md
    text: knowledge 应用层定义 `Selector` 端口。selector 每层接收固定 revision、query
      context、parent node revision、有序候选、可选已钉扎 summary 和预算；输出按 candidate order
      排列的 decision 列表，每项包含 `node_revision_id` 和 `select`、`expand` 或
      `select_expand` action。`stop` 只表示该层返回空 decision 并终止当前
      branch。领域层逐项重新校验成员、父子关系、顺序、重复、revision 和总预算。
    result: passed
    reason:
      text: Selector membership, order, action, parent and revision validation is
        enforced.
      truncated: false
  - id: A43
    source: specs/knowledge-core/spec.md
    text: candidate set 使用 UTF-8 规范串计算 SHA-256：首行为 `candidate-set-v1`，随后依次是 frozen
      knowledge revision ID、parent node revision ID，再按候选顺序写
      `ordinal|node_revision_id|score|title_sha256|summary_artifact_id-or--`，每项以
      LF 结束。selector response 必须回显该 hash；不一致视为 stale response 并整层回退。
    result: passed
    reason:
      text: candidate-set-v1 hash binds frozen revision, parent, candidate fields and
        artifact ID.
      truncated: false
  - id: A44
    source: specs/knowledge-core/spec.md
    text: 模型配置可用时，LLM adapter 复用现有 `llm.Client.Chat` 发送结构化 JSON；无模型、超时、上游错误、schema
      错误、未知/跨 revision ID、超量选择或 stale artifact 时，整层结果丢弃并使用 `lexical-v1`，trace 标记
      `degraded=true` 与稳定 reason code。坏的模型响应不能部分生效。
    result: passed
    reason:
      text: All reported model failure modes trigger whole-layer lexical fallback with
        stable reasons.
      truncated: false
  - id: A45
    source: specs/knowledge-core/spec.md
    text: 检索响应包含 frozen knowledge revision、retriever/selector/query-context
      版本、summary snapshot、每层 parent、按序候选、按候选记录的 decision/action、candidate
      hash、reason code、degraded/truncated，以及最终 document ID、document revision
      ID、node ID、node revision ID、path、source ranges、canonical slice、slice
      SHA-256 和 provenance。默认最大深度 8、每层候选 20、最终 hit 10、总候选 200；超限按上述稳定顺序截断并显式标记。
    result: passed
    reason:
      text: Retrieval response exposes versions, summary, shortlist, trace, decisions,
