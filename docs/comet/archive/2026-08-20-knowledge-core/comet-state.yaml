      truncated: false
  - id: A27
    source: specs/knowledge-core/spec.md
    text: parser profile 固定为 `github.com/yuin/goldmark v1.8.5`、CommonMark 0.31.2 和
      GFM。Obsidian wiki link、callout 与其他未识别扩展按原始文本保留。parser/profile
      升级必须使用新版本号，并以 corpus 对比证明不会静默改变旧 revision 的重建含义。
    result: passed
    reason:
      text: Goldmark v1.8.5/GFM profile and parser version are fixed.
      truncated: false
  - id: A28
    source: specs/knowledge-core/spec.md
    text: 每个文档有一个 synthetic root node，其 ID 来自 frontmatter。heading node 使用最近的较低 level
      heading 为父节点；level 跳跃不补虚拟节点。首个 heading 前的 preamble 属于 root，文档没有 heading
