      truncated: false
  - id: A29
    source: specs/knowledge-core/spec.md
    text: 每个 node revision 保存有序 sibling index、heading
      level、标题、祖先标题、`heading_range`、`local_body_range` 和 `section_range`。范围使用
      canonical UTF-8 字节的半开区间 `[start,end)` 并附 1-based 起止行；Setext heading
      范围覆盖完整物理行。section 截止于下一个 level 小于等于当前 node 的 heading，local body 排除子
      section。
    result: passed
    reason:
      text: Node order, ancestry, UTF-8 byte ranges and line numbers including Setext
        are implemented.
      truncated: false
  - id: A30
    source: specs/knowledge-core/spec.md
    text: 全量重建输入只包括 document ID、canonical Markdown、冻结 profile/version 和 identity
      envelope。重建结果包含完全相同的 document/node revision ID、父子关系、顺序、hash 与范围；数据库已有
      summary、模型输出或检索轨迹不属于重建输入。
    result: passed
    reason:
      text: Canonicalizer.Index rebuild depends only on canonical content, identity
