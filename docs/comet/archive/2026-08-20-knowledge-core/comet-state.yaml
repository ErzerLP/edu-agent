      truncated: false
  - id: A25
    source: specs/knowledge-core/spec.md
    text: 导出视图在 frontmatter 增加 `edu-agent-source-revision-id`，该字段说明导出来源但不属于
      canonical hash；再导入时先校验并剥离该 view metadata。导出不得叠加重复键或 marker。
    result: passed
    reason:
