  - id: A26
    source: specs/knowledge-core/spec.md
    text: 每个 Markdown heading 正前方使用独占一行的 `<!-- edu-agent-node:v1 {"id":"UUID"} -->`
      标记 NodeID。只有 AST 中与 heading 同级且中间只有空白的 HTML block 才是保留
      marker；代码围栏、引用块、inline code 和普通文本中的相同字符串不被识别。重复 ID、一个 heading 多 marker、孤立
      marker、非法 JSON/UUID 或当前 document 无权声明的 ID 返回 `invalid_identity_marker`。
    result: passed
    reason:
      text: Only legal adjacent heading markers are accepted; pseudo, duplicate,
