      truncated: false
  - id: A46
    source: specs/knowledge-core/spec.md
    text: 固定验收 corpus 至少包含 `go/concurrency.md` 的 `Concurrency -> Goroutine,
      Channel`、`db/index.md` 的 `Database Index`，以及 `systems.md` 的 `Systems ->
      Queue Overview, Messaging -> Queue Types`；Channel 与 Queue Overview 没有
