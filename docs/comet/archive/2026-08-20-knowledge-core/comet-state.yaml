      truncated: false
  - id: A24
    source: specs/knowledge-core/spec.md
    text: frontmatter 使用 `go.yaml.in/yaml/v3 v3.0.5` 解析为 mapping
      并保留用户键。服务拥有三个顶层保留键：`edu-agent-format`、`edu-agent-document-id` 和
      `edu-agent-root-node-id`。格式版本为 1，两个 ID 是 canonical identity；重复键、非 scalar
      保留值、非法 UUID 或用户占用不兼容值使导入失败。无 frontmatter 时服务创建一个最小 YAML envelope。
    result: passed
    reason:
      text: YAML mapping, reserved keys and duplicate/non-scalar/invalid identity
