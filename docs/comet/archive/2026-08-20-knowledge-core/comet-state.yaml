      truncated: false
  - id: A13
    source: specs/knowledge-core/spec.md
    text: 系统维护一个单用户 knowledge catalog。`KnowledgeRevision` 是 catalog 的完整线性快照，包含
      UUID、从 1 开始单调递增的 `revision_no`、可空父 revision、SHA-256 manifest
      hash、来源、创建设备、创建时间，以及 canonicalizer、parser、indexer 和 identity policy
      版本。head 由 catalog 单例行保存并在导入事务中更新。
    result: passed
    reason:
      text: Catalog singleton, linear parent, monotonic revision number and head
        update are implemented.
      truncated: false
  - id: A14
    source: specs/knowledge-core/spec.md
    text: 每个 snapshot 通过 immutable mapping 引用按规范路径排序的 `DocumentRevision`。导入是基于父
      snapshot 的 upsert：请求中的文档替换或增加对应 document identity，未提交文档继续引用父
      snapshot，省略文档不表示删除。snapshot 内 canonical path 和 DocumentID 分别唯一且一一对应；一个已确认
      DocumentID 以新路径出现时，提交事务移除该 snapshot 中的旧路径映射并写入新路径，这属于 move。批内重复 DocumentID
      返回 `duplicate_document_identity`，新路径已由另一 DocumentID 占用返回
      `path_occupied`。完全相同的排序 manifest 返回当前 revision 和 `unchanged=true`，不递增
      revision number。
    result: passed
    reason:
      text: Snapshot upsert, carry-forward, move, uniqueness and unchanged-manifest
        behavior are implemented.
      truncated: false
  - id: A15
    source: specs/knowledge-core/spec.md
    text: "`DocumentID` 和 `NodeID` 是跨 revision 的稳定语义身份。`DocumentRevisionID` 由固定
      UUIDv5 namespace、document ID、canonical hash 和 parser profile
      得到；`NodeRevisionID` 由固定 UUIDv5 namespace、document revision ID、node ID 和
      indexer version 得到。同一 canonical document revision 重建时 ID 不依赖数据库插入顺序或随机数。"
    result: passed
    reason:
      text: Document and node revisions use fixed UUIDv5 namespaces and deterministic
        inputs.
      truncated: false
  - id: A16
    source: specs/knowledge-core/spec.md
