      basis 返回的稳定 locator 和 expected parent 候选。
    result: passed
    reason:
      text: Import validates operation, explicit expected parent, source, documents
        and resolution boundaries.
      truncated: false
  - id: A19
    source: specs/knowledge-core/spec.md
    text: 服务为规范化后的完整正式请求计算 request hash，其中包含 resolutions。只有成功提交或 `unchanged` 的
      import 才持久化 operation：相同 operation ID 与相同 hash 返回第一次结果，相同 operation ID 与不同
      hash 返回 `idempotency_conflict`。expected parent 与事务中锁定的 catalog head 不同返回
      `revision_conflict`，响应给出当前 head，不能自动 rebase 或覆盖。
    result: passed
    reason:
      text: Request hashing, replay/conflict, expected-parent conflict and transaction
        lock paths are implemented.
      truncated: false
  - id: A20
    source: specs/knowledge-core/spec.md
    text: identity review 使用独立 `identity_review_basis_hash`：它只覆盖 expected
      parent、canonicalizer/identity policy 版本和规范化文档 path/content，不包含 operation
      ID、review hash 或任何 resolution。`identity_review_required` 响应回显 basis hash
      和由它导出的 locator，不写 import operation、revision 或 head。调用方加入 resolutions
      重试时必须使用新的 operation ID 并回显 basis hash；服务重算不一致时返回 `stale_identity_review`。
    result: passed
    reason:
      text: HMAC receipt binds basis and an actually issued review operation;
        fresh-operation regression passes.
      truncated: false
  - id: A21
    source: specs/knowledge-core/spec.md
    text: 解析、UTF-8/大小检查、AST 构建、身份候选和 manifest 预计算在事务外执行。提交使用 `READ COMMITTED`，锁
      catalog 单例行后再次检查 expected parent，并在一个事务中写入
      operation、revision、document、node、lineage、snapshot mapping 与
      head。任一错误或故障注入都回滚全部 canonical 写入。
    result: passed
    reason:
      text: Precomputation is outside CommitImport and commit uses READ
        COMMITTED/catalog lock/atomic writes.
      truncated: false
  - id: A22
    source: specs/knowledge-core/spec.md
    text: 请求 JSON 最大 16 MiB，单文档最大 4 MiB，文档数最大 1000，单批节点数最大 100000。路径转换为 NFC、使用
      `/`、必须为非空相对路径；拒绝绝对路径、空段、`.`、`..`、反斜杠、NUL、控制字符以及 NFC + Unicode case-fold
      后重复。限制错误返回 `413 payload_too_large` 或 `400 invalid_path`。
    result: passed
    reason:
      text: Body/document/node limits and NFC, relative, control and folded-path
        validation are implemented.
      truncated: false
  - id: A23
    source: specs/knowledge-core/spec.md
    text: canonicalizer profile `edu-markdown-v1` 要求合法 UTF-8、移除单个 UTF-8 BOM 并把
      CRLF/CR 统一为 LF。它不 trim 正文，也不通过 Markdown renderer 重写内容。除换行规范化和插入或更新保留
      envelope 外，用户 Markdown 字节不改变。
    result: passed
