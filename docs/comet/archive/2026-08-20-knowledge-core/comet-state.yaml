      truncated: false
  - id: A31
    source: specs/knowledge-core/spec.md
    text: 身份解析必须先完成 document stage，再完成 node stage。document locator 是 basis hash
      与规范化请求 path 的确定性组合；优先级依次为合法显式 DocumentID、expected parent 中双向唯一相同 semantic
      document hash、调用方 `preserve/new` resolution、新
      DocumentID。同路径、标题和模糊相似度只生成审阅候选，不能自动继承。semantic document hash 从去除保留
      frontmatter 键与 node marker、统一换行后的 Markdown 计算。未知显式 DocumentID 仅在 catalog
      历史中从未出现且批内唯一时作为可移植新 identity 接受；历史存在但不属于 expected parent、批内重复或跨父 revision
      引用均返回稳定冲突。
    result: passed
    reason:
      text: Document-first identity priority and history/conflict checks are
        implemented.
      truncated: false
  - id: A32
    source: specs/knowledge-core/spec.md
    text: 缺少显式 DocumentID 且未形成双向唯一 exact semantic hash 时，只要 expected parent
      中存在同路径或其他候选，服务就返回 `identity_review_required`；完全没有候选时才生成新 DocumentID。响应中的
      document locator、候选 DocumentID/document revision、reason code 与 evidence 均按
      stable ID 排序。调用方重试可选择 `preserve` 某个 expected-parent 文档或 `new`；完成 document
      ownership 后，领域层才允许该文档中的 node marker 声明属于该 document 的 NodeID。
    result: passed
    reason:
      text: Ambiguous document identity returns stable review evidence; no-candidate
        input creates a new identity.
      truncated: false
  - id: A33
    source: specs/knowledge-core/spec.md
    text: node 身份顺序固定为：有效显式 marker、双向唯一确定性匹配、调用方 resolution、新身份。markerless node 只有在旧
      snapshot 的已归属 document 集合中存在唯一相同 semantic local-body hash，且反向也唯一时才自动保留
      NodeID；路径、标题、祖先、邻居或模糊相似度只用于生成候选，不能单独自动继承。
    result: passed
    reason:
      text: Marker, exact hash, resolution and new identity order is enforced without
        ambiguous inheritance.
      truncated: false
  - id: A34
    source: specs/knowledge-core/spec.md
    text: "`identity-policy-v1` 的 similarity 输入不包含标题、ancestor、marker 或 summary。它把
      Goldmark local-body 的可见文本做 Unicode NFKC 与 case-fold，连续字母/数字为一个 token，每个
      CJK rune 为 token，丢弃标点和空白；不少于 5 个 token 时比较唯一 5-token shingles，否则比较唯一
      token，分数是集合 Jaccard intersection/union。相同 semantic hash 记 1；一空一非空记
      0；两者都空只允许显式 marker 的一对一标题/移动保留。带 marker 的一对一编辑在分数至少 0.50 时自动保留，低于
      0.50、任一非空正文少于 8 token 且 hash 改变、复制 marker、一个旧节点对应多个新位置或多个旧节点对应一个新位置时返回
      `identity_review_required`。阈值和 token 规则随 policy version 冻结。"
    result: passed
    reason:
      text: Frozen NFKC/case-fold/CJK/shingle/Jaccard policy and threshold guards are
        implemented.
      truncated: false
  - id: A35
    source: specs/knowledge-core/spec.md
    text: 审阅响应包含 document path、preorder node locator、reason code、旧 node revision
      候选、分数和确定性 evidence，不写任何 revision。调用方重试时可按 node locator 提交
      `preserve`、`new`、`rewrite`、`split` 或 `merge` resolution，并提供非空理由；`preserve`
      表示用户确认语义连续，其他 lineage 动作表示用户确认重大变化。`preserve` 保持 NodeID；`new` 生成新
      NodeID；`rewrite`、`split` 和 `merge` 为目标生成新 NodeID 并记录 approved lineage
      group、source/target node revision、actor device、理由、policy version
      和时间。resolution 只能引用 expected parent 中的候选以及本次 AST locator，领域层拒绝未知、重复或跨
      revision 引用。
    result: passed
    reason:
      text: Review locators/evidence and preserve/new/rewrite/split/merge
        resolution/cardinality validation are tested.
      truncated: false
  - id: A36
    source: specs/knowledge-core/spec.md
    text: 纯文件移动不改变 canonical document/node revision；snapshot mapping 只改变
      path。标题改名、章节重排或普通编辑保留稳定 ID，但 canonical 变化时产生新的 document/node
      revision。lineage 获批只表达历史关系，不迁移、折扣或复制任何学习证据。
    result: passed
    reason:
      text: Pure moves preserve revisions; canonical changes create revisions and
        lineage only records relationships.
      truncated: false
  - id: A37
    source: specs/knowledge-core/spec.md
    text: "`NodeArtifact` 是可丢弃、不可覆盖的版本化派生记录，至少包含 node revision
      ID、kind、producer/prompt/model version、input hash、content、created time 和
