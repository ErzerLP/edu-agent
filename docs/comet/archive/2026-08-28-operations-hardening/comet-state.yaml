acceptance:
  - id: A1
    source: brief.md
    text: A1：从干净源码工作树运行统一 candidate 入口时，runner
      先验证工具、daemon、平台、磁盘/临时目录和固定依赖锁，再按确定顺序执行所选门禁；任何必需前置条件缺失返回 `blocked/not-run`
      或非零失败，不生成 pass evidence。
    result: passed
    reason:
      text: Preflight validates writable evidence/temp resources, tools, daemons,
        platform, fixed locks, host lock and Go selections; unavailable
        prerequisites cannot emit pass.
      truncated: false
  - id: A2
    source: brief.md
    text: A2：每个 evidence manifest
      绑定候选源码摘要、runner与lock摘要、测试选择、Go/Docker/Compose/Skopeo版本、OS/arch、开始/结束时间、脱敏日志SHA-256和终态。resume只接受字段完整、日志hash匹配且所有输入相同的
      pass evidence；手工、截断、旧输入或未知字段证据被拒绝。
    result: passed
    reason:
      text: Strict v3/v2 schemas, domain-separated HMAC attestations, complete key
        material, log hashes and resume log reparse were verified.
      truncated: false
  - id: A3
    source: brief.md
    text: A3：所有具名 Go 门禁在执行前证明至少一个测试匹配，执行后证明至少一个目标测试实际通过；零匹配、全部skip、`[no tests to
      run]`、缺失运行记录或空日志不能产生 pass evidence。
    result: passed
    reason:
      text: Every required Go target has RUN/PASS evidence with no required skip,
        no-tests marker or empty event stream.
      truncated: false
  - id: A4
    source: brief.md
    text: A4：PostgreSQL、Nocturne和Fast Note Sync使用批准的精确image/platform/config
      digest及版本锁。任一锁、runner、schema、fixture或生产输入变化都使对应旧证据失效；升级必须重跑受影响真实契约，不能根据旧版本通过自动宣称兼容。
    result: passed
    reason:
      text: PostgreSQL, NoteSync and Nocturne versions, commits, platforms,
        image/config/OCI digests and authoritative locks match.
      truncated: false
  - id: A5
    source: brief.md
    text: A5：所有重型Docker/PostgreSQL门禁共享一个host级候选锁，使用唯一工作/evidence目录、隔离数据库或schema、动态非冲突资源和有界清理。并发调用不会覆盖日志、复用错误容器或把另一候选结果归因到当前候选。
    result: passed
    reason:
      text: All heavyweight runners share the inherited host lock and use isolated
        temporary, schema, Compose and cleanup resources.
      truncated: false
  - id: A6
    source: brief.md
    text: A6：真实 programmable fake model经生产client/adapter、learning
      service和真实PostgreSQL执行固定 assessment
      corpus。schema错误不产生权威学习事实；低置信保持provisional；瞬态超时或rate
      limit只按策略重试一次并保存attempt类别；重试耗尽返回degraded且不改变authoritative
      session/evidence。
    result: passed
    reason:
      text: Production fake-model vertical traverses real
        client/adapter/service/PostgreSQL and proves schema, confidence, retry
        and authority invariants.
      truncated: false
  - id: A7
    source: brief.md
    text: A7：同一固定模型语料分别以明确的baseline与candidate model
      profile/version运行；两者必须满足相同schema、错误分类、重试、provisional/accepted和持久化不变量。profile或协议版本变化自动失效旧模型证据。
    result: passed
    reason:
      text: Distinct baseline and candidate profiles execute the same corpus and
        produce identical contract summaries.
      truncated: false
  - id: A8
    source: brief.md
    text: A8：包含add、edit、move、reorder、delete和unchanged文档的固定Knowledge语料，在任意输入排列下，增量snapshot与独立fresh
      rebuild的规范化完整树逐字段一致，包括stable identity、parent/order、ranges、canonical
      slice/hash、manifest和lineage。
    result: passed
    reason:
      text: Knowledge add/edit/move/reorder/delete/unchanged corpus matches an
        independent full-tree golden across fresh schemas and input orders.
      truncated: false
  - id: A9
    source: brief.md
    text: A9：覆盖canonical learning event families、补偿/redaction事件及Offline
      ingest/evaluation的固定语料，逐事件增量reducer与从零replay得到相同规范化projection与semantic
      fingerprint；response
      loss、重试和重启不重复Attempt、Assessment、Decision、Evidence或Outbox事实。
    result: passed
    reason:
      text: Canonical, compensation, redaction and Offline events produce identical
        incremental and production rebuild projections/fingerprints without
        duplicate facts.
      truncated: false
  - id: A10
    source: brief.md
    text: A10：真实PostgreSQL中同一pairing
      code并发消费恰好一个device/token成功；任一device/token/code写点故障全部回滚且不消费code，移除故障后相同code可成功使用；device吊销提交与并发认证/Offline提交必须线性化，且任何signed/request
      credential epoch与锁定的当前持久epoch不一致的Offline
      item都必须零写入并fail-closed。本change不新增epoch rotation入口，也不以直接SQL突变伪造不存在的用户流程。
    result: passed
    reason:
      text: Real PostgreSQL pairing, rollback, revoke/auth race and Offline
        credential-epoch zero-write fences pass through production stores.
      truncated: false
  - id: A11
    source: brief.md
    text: A11：真实PostgreSQL Outbox consumer在业务副作用已提交而`applied`
      finalize前故障时，可在lease后reclaim；业务幂等键保证最终只有一个副作用和一个合法terminal状态。claim/defer/dead/cancel/apply写点失败不消费operation且不留下部分sibling
      writes。
    result: passed
    reason:
      text: Production Outbox worker reclaim converges after committed side
        effect/finalize failure; all transition fault groups roll back
        atomically.
      truncated: false
  - id: A12
    source: brief.md
    text: A12：完整candidate索引明确列出 PostgreSQL shards、Offline黑盒、fake-model vertical、Fast
      Note Sync真实容器和Nocturne真实OCI/Compose gate的
      `passed/failed/blocked/not-run/reused` 状态及evidence
      key；只有全部必需项通过或合法复用时总体才为passed，Runtime和Verifier可独立复算该结论。
    result: passed
    reason:
      text: The attested index lists all 11 required lanes and independently
        recomputes overall passed.
      truncated: false
  - id: A13
    source: specs/operations-hardening/spec.md
    text: Fail-closed evidence A clean-worktree candidate run records complete input
      identities, environment, actual target test events and redacted log
      hashes. Missing prerequisites, zero matches, all skips, malformed
      evidence, changed inputs or missing logs cannot produce or reuse a pass.
    result: passed
    reason:
      text: Behavior inputs match HEAD and complete signed identities, target events
        and redacted log hashes fail closed under drift or corruption.
      truncated: false
  - id: A14
    source: specs/operations-hardening/spec.md
    text: Fixed dependencies and isolated resources PostgreSQL, Nocturne and Fast
      Note Sync accept only approved exact locks and share a host qualification
      lock while retaining isolated work, database, container and evidence
      resources. A lock change invalidates the affected evidence and requires
      its real contract to run again.
    result: passed
    reason:
      text: Fixed dependency identities and shared/isolated resource contracts are
        bound into current evidence keys.
      truncated: false
  - id: A15
    source: specs/operations-hardening/spec.md
    text: Production model vertical The fixed corpus runs baseline and candidate
      profiles through the programmable fake service, production model
      client/adapter, learning service and real PostgreSQL. Schema drift, low
      confidence, timeout, rate limit, retry exhaustion and later success
      preserve the defined authority, provenance and retry invariants.
    result: passed
    reason:
      text: Both model profiles preserve schema, provenance, authority, retry
        exhaustion and later-success invariants.
      truncated: false
  - id: A16
    source: specs/operations-hardening/spec.md
    text: Knowledge rebuild parity For unchanged, add, edit, move, reorder and
      delete corpus operations in relevant input orders, incremental snapshot
      construction and an independent fresh rebuild produce the same normalized
      full tree, identities, lineage, ordering, ranges, slices, hashes,
      manifests and deletion semantics.
    result: passed
    reason:
      text: Knowledge normalized full-tree comparison uses a static independent golden
        and covers all formal structural fields.
      truncated: false
  - id: A17
    source: specs/operations-hardening/spec.md
    text: Learning replay parity A versioned corpus covering canonical,
      compensation, redaction and Offline events produces the same normalized
      projection and semantic fingerprint under incremental reduction and
      from-zero replay. Response loss, retry and restart do not duplicate
      authoritative facts.
    result: passed
    reason:
      text: Learning production rebuild switches generations while preserving the
        complete normalized snapshot and semantic fingerprint.
      truncated: false
  - id: A18
    source: specs/operations-hardening/spec.md
    text: Identity and Outbox atomicity Real PostgreSQL proves one-time pairing
      concurrency, rollback, committed-revoke fences and zero-write rejection of
      signed/request credential-epoch mismatches, plus Outbox reclaim after a
      committed idempotent side effect but failed finalize. Injected write
      failures leave no partial siblings and converge to one legal terminal
      result.
    result: passed
    reason:
      text: Identity, epoch and Outbox atomicity tests invoke production transactions
        and workers rather than simulated terminal success.
      truncated: false
  - id: A19
    source: specs/operations-hardening/spec.md
    text: Aggregate qualification The aggregate index lists every required
      deterministic, PostgreSQL, Offline, fake-model, Fast Note Sync and
      Nocturne gate as passed, failed, blocked, not-run or validly reused with
      its evidence key. The candidate passes only when every required gate is
      passed or validly reused.
    result: passed
    reason:
      text: Index, manifest and recomputed evidence keys/signatures/logs agree for
        every required lane.
      truncated: false
  - id: A20
    source: specs/operations-hardening/spec.md
    text: Operational limits and privacy Unavailable registries, daemons, disk or
      platforms remain blocked/not-run and never imply pass. Durable logs and
      evidence exclude credentials and learner or knowledge content; Obsidian
      desktop automation and real model-provider calls remain outside
      qualification.
    result: passed
    reason:
      text: Unavailable prerequisites remain non-pass, durable logs are redacted, and
        formal external-provider/UI non-goals are not misrepresented.
      truncated: false
