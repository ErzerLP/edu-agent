    result: pending
    reason: null
  - id: A2
    source: brief.md
    text: A2：A created proposal reports the service-computed base, bounded diff,
      identity and lineage impact, valid-evidence impact, risk, basis hash, and
      policy versions. Closed schemas reject attempts to inject computed or
      actor fields.
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: A3：A bounded pure addition and a bounded local body edit auto-apply and
      create a new canonical head. A path/title/tree/stable-identity change,
      truncated analysis, uncertain identity, or affected valid evidence remains
      open.
    result: pending
    reason: null
  - id: A4
    source: brief.md
    text: A4：Move, major rewrite, split, merge, delete, restore, and rollback stay
      open until a `knowledge:approve` decision. Missing scope, stale basis, or
      invalid structural resolution cannot change the head.
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: A5：Auto-apply or approve commits proposal state, decision, revision,
      lineage/origin, idempotency result, head, privacy generation check, and
      NoteSync intents atomically. Injected failure leaves no partial state.
    result: pending
    reason: null
  - id: A6
    source: brief.md
    text: A6：Two proposals based on the same head cannot both advance it. At most
      one applies; the other becomes deterministically stale and reports the
      current revision without automatic rebase.
    result: pending
    reason: null
  - id: A7
    source: brief.md
    text: A7：Applied rewrite/split/merge lineage has valid existing cardinality;
      move preserves stable identity; delete/restore/rollback impacts remain
      queryable from the proposal and revision origin.
    result: pending
    reason: null
  - id: A8
    source: brief.md
    text: A8：Rollback creates a new revision ID and revision number with the
      previous head as parent and the historical target manifest/content. The
      target and intervening revisions remain readable and unchanged.
    result: pending
    reason: null
  - id: A9
    source: brief.md
    text: A9：Applying a knowledge proposal does not write learning evidence,
      learning events, or learning projections, and old evidence remains exactly
      bound to the original revision.
    result: pending
    reason: null
  - id: A10
    source: brief.md
    text: A10：An affected lineage creates a separate carryover proposal. Knowledge
      approval cannot approve it. `learning:approve` approval appends a
      provisional carryover without mutating source evidence; rejection creates
      no carryover effect.
    result: pending
    reason: null
  - id: A11
    source: brief.md
    text: A11：Incremental and full replay expose the same provisional carryover
      state and fingerprint. Carryover never increases accepted evidence,
      retained mastery, or review advancement.
    result: pending
    reason: null
  - id: A12
    source: brief.md
    text: A12：Restricted Agent credentials can submit/read proposals but receive 403
