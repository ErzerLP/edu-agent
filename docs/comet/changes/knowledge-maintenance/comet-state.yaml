acceptance:
  - id: A1
    source: brief.md
    text: A1：Replaying the same proposal operation with the same base, sources,
      candidate, and requested identity resolutions returns the same proposal;
      changing any bound input returns a machine-readable idempotency conflict.
    result: passed
    reason:
      text: Create and decision request hashes bind all caller inputs; advisory locks
        and stored operations provide exact replay and conflicting inputs return
        idempotency conflict.
      truncated: false
  - id: A2
    source: brief.md
    text: A2：A created proposal reports the service-computed base, bounded diff,
      identity and lineage impact, valid-evidence impact, risk, basis hash, and
      policy versions. Closed schemas reject attempts to inject computed or
      actor fields.
    result: passed
    reason:
      text: Diff, identity, lineage, evidence impact, risk, basis, and policy versions
        are service-computed; closed HTTP/MCP/CLI schemas reject computed or
        actor injection.
      truncated: false
  - id: A3
    source: brief.md
    text: A3：A bounded pure addition and a bounded local body edit auto-apply and
      create a new canonical head. A path/title/tree/stable-identity change,
      truncated analysis, uncertain identity, or affected valid evidence remains
      open.
    result: passed
    reason:
      text: Bounded additions and local body edits may auto-apply while structural,
        identity-uncertain, truncated, or evidence-affected changes remain open
        under the conservative policy.
      truncated: false
  - id: A4
    source: brief.md
    text: A4：Move, major rewrite, split, merge, delete, restore, and rollback stay
      open until a `knowledge:approve` decision. Missing scope, stale basis, or
      invalid structural resolution cannot change the head.
    result: passed
    reason:
      text: High-risk changes and rollback require knowledge:approve; missing scope,
        stale basis, or invalid resolution cannot advance the canonical head.
      truncated: false
  - id: A5
    source: brief.md
    text: A5：Auto-apply or approve commits proposal state, decision, revision,
      lineage/origin, idempotency result, head, privacy generation check, and
      NoteSync intents atomically. Injected failure leaves no partial state.
    result: passed
    reason:
      text: Proposal, decision, revision, lineage/origin, head, operation, carryover,
        and NoteSync intent writes share one PostgreSQL transaction; injected
        failures leave no partial state.
      truncated: false
  - id: A6
    source: brief.md
    text: A6：Two proposals based on the same head cannot both advance it. At most
      one applies; the other becomes deterministically stale and reports the
      current revision without automatic rebase.
    result: passed
    reason:
      text: Knowledge catalog locking serializes same-base application; concurrency
        evidence shows one applied result and one deterministic stale result.
      truncated: false
  - id: A7
    source: brief.md
    text: A7：Applied rewrite/split/merge lineage has valid existing cardinality;
      move preserves stable identity; delete/restore/rollback impacts remain
      queryable from the proposal and revision origin.
    result: passed
    reason:
      text: Canonical planner enforces lineage cardinality, move identity
        preservation, and queryable delete/restore/rollback impacts and origins.
      truncated: false
  - id: A8
    source: brief.md
    text: A8：Rollback creates a new revision ID and revision number with the
      previous head as parent and the historical target manifest/content. The
      target and intervening revisions remain readable and unchanged.
    result: passed
    reason:
      text: Rollback creates a new child revision with historical manifest/content
        while preserving the target and intervening revisions unchanged and
        readable.
      truncated: false
  - id: A9
    source: brief.md
    text: A9：Applying a knowledge proposal does not write learning evidence,
      learning events, or learning projections, and old evidence remains exactly
      bound to the original revision.
    result: passed
    reason:
      text: Knowledge apply creates only the independent carryover proposal and does
        not mutate learning evidence, events, projections, or original revision
        binding.
      truncated: false
  - id: A10
    source: brief.md
    text: A10：An affected lineage creates a separate carryover proposal. Knowledge
      approval cannot approve it. `learning:approve` approval appends a
      provisional carryover without mutating source evidence; rejection creates
      no carryover effect.
    result: passed
    reason:
      text: Carryover is learning-owned; knowledge approval cannot approve it,
        learning:approve appends a provisional link/event, and rejection creates
        no carryover effect.
      truncated: false
  - id: A11
    source: brief.md
    text: A11：Incremental and full replay expose the same provisional carryover
      state and fingerprint. Carryover never increases accepted evidence,
      retained mastery, or review advancement.
    result: passed
    reason:
      text: Incremental and full replay agree on carryover state/fingerprint and
        carryover does not advance accepted evidence, mastery, retained state,
        or review.
      truncated: false
  - id: A12
    source: brief.md
    text: A12：Restricted Agent credentials can submit/read proposals but receive 403
      from raw import, knowledge decision, rollback, carryover decision,
      Assessment decision, and Memory admission/deletion paths. Existing user
      credentials retain their current compatible scopes.
    result: passed
    reason:
      text: Restricted Agent credentials are denied raw import, rollback,
        knowledge/carryover/Assessment decisions, and Memory writes; active
        legacy users retain both approval authorities while revoked credentials
        remain unchanged.
      truncated: false
  - id: A13
    source: brief.md
    text: A13：HTTP, MCP propose/read, and CLI review flows use the same application
      proposal records, scopes, errors, privacy permits, rate limits, and audit
      policy. MCP discovery contains none of the forbidden approval or
      direct-write descriptors.
    result: passed
    reason:
      text: HTTP, MCP, and CLI share the same application services and records; MCP
        exposes only proposal/read and carryover/read descriptors with no
        approval, rollback, or direct-write surface.
      truncated: false
  - id: A14
    source: brief.md
    text: A14：Closing the knowledge or learning privacy generation during a proposal
      or carryover response prevents content leakage. After erasure, candidate
      Markdown, diffs, source excerpts, reasons, and carryover payloads cannot
      be retrieved.
    result: passed
    reason:
      text: Production HTTP and MCP outer buffers flush inside CommitResponse while
        canonical persistent shared owner gates and then local write gates are
        held through the full write. Close-win never invokes the callback,
        response-win makes close wait, pgx waits are cancellable, generic 503
        redaction remains leak-free, and PostgreSQL scrub removes
        proposal/carryover payloads.
      truncated: false
