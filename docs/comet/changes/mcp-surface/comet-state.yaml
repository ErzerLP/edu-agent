  summary:
    text: "Repaired A7 by adding ordered, owner-scoped response commit gates to
      ReadPermitManager. CommitResponse and CloseAndDrain now share a
      cancellable linearization boundary: if privacy closure wins, the
      serialized MCP buffer is discarded before any business bytes are written;
      if response commit wins, closure cannot begin until the complete write
      finishes. The gate wait honors CloseAndDrain context deadlines and
      unrelated owners remain independent. The MCP handler now performs its
      final buffered write only through CommitResponse. Added deterministic
      close-wins, response-wins, and timeout regressions and updated the design
      contract."
