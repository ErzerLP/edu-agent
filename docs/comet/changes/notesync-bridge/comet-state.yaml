  - id: A1
    source: brief.md
    text: A1：兼容矩阵固定 Fast Note Sync Service `3.6.1` 与 Obsidian plugin `2.4.0` 的
      tag/commit及实际 `GET /api/version`、`GET /api/health`、`GET /api/vault`、`GET
      /api/note`、`GET /api/notes` 和 `POST /api/note` 合同；升级、未知版本或未知业务 envelope
      不自动视为兼容，候选必须通过真实上游服务而非仅 fake。
    result: passed
    reason:
      text: 固定 3.6.1 client 实现真实 version/health/vault/note/notes 路由、严格 envelope 与未知版本
        fail-closed；digest-pinned 真实上游门禁通过。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2：启用 bridge 必须提供安全校验后的base URL、server-only API token、vault和受管path
      prefix。token使用`Authorization: Bearer <token>`，要求`X-Client: CLI`、`p:rest
      c:CLI f:note_r,note_w`及configured
      vault限制，不返回HTTP/CLI、不进入日志、错误或导出；redirect和非授权明文连接fail closed。"
    result: passed
    reason:
      text: 配置、Bearer、X-Client、note_r/note_w、vault、redirect 与明文连接均 fail closed；真实门禁验证无
        token、错误 client 和越权 vault 被拒绝。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：canonical KnowledgeRevision 在同一 PostgreSQL
      事务中为受影响文档写入带generation、单调revision和确定性幂等键的Outbox意图；外部调用只在提交后发生，Fast Note
      Sync故障不回滚知识revision或阻塞核心学习。
    result: passed
    reason:
      text: KnowledgeRevision 与 generation-bound、单调 revision、确定性幂等 Outbox intent 在同一
        PostgreSQL 事务提交，远端 I/O 仅在提交后运行。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：consumer发送前重新读取当前knowledge head、stable document、publication
      mapping和generation。旧revision或旧generation作为superseded
      no-op且不发网；首次发布只create-only，后续仅在remote exact
      content等于持久base或目标时收敛，漂移/删除/占用只生成review。
    result: passed
    reason:
      text: consumer 重查双 generation、当前 head/document、mapping 与 lease；旧消息不发网，首次
        create-only，后续只基于 exact durable base/target 收敛。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：写入成功必须exact GET readback后才推进publication base；超时、EOF或response
      loss按unknown
      outcome读回对账。remote等于target才applied，等于base才可重试，其他内容转review，不允许blind
      retry或把HTTP 200当作业务成功。
    result: passed
    reason:
      text: 每次写后 exact GET；response loss 通过 GET 对账，只有 target exact 才
        applied，base/frozen 可重试，其他内容进入 review。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：publication mapping以stable document ID为主键，保存固定remote
      vault/path、已验证source/document revision、exact base
      Markdown和SHA-256。canonical
      path/title变化不改变身份或静默rename/delete；发布Markdown复用现有Obsidian export并保留stable
      ID及`edu-agent-source-revision-id`。
    result: passed
    reason:
      text: mapping 以 stable document ID 为主键并保存固定 vault/path、revision、exact
        base/SHA-256/generation；export 保留 stable IDs 与 source revision。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：显式preview按指定path或受管prefix有界分页读取真实remote
      Markdown，生成不可变`base/local/remote` snapshot、line-level三方diff、source
      revision、identity和basis hash；扫描本身不创建KnowledgeRevision、不自动回写。
    result: passed
    reason:
      text: 显式有界 preview 冻结 base/local/remote、身份、source revision、hash 与三方 diff；扫描不触发
        knowledge import。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：review只允许accept-remote、keep-canonical或用户提供merged
      Markdown。应用前重新核对generation、local head和remote
      hash；陈旧basis拒绝。accept/merge复用现有knowledge import、expected parent和identity
      review形成新immutable revision，不能走bridge专用后门。
    result: passed
    reason:
      text: 仅允许 accept_remote、keep_canonical、merged；重查
        generation/head/remote/basis，accept/merged 均复用 expected-parent knowledge
        import 与 identity review。
      truncated: false
  - id: A9
    source: brief.md
    text: A9：notesync HTTP/CLI只调用应用用例并复用现有设备认证、knowledge scope、限流、审计、read
      permit和稳定错误；CLI不读取remote token、不直连Fast Note
      Sync、不在argv或本地状态保存Markdown。OpenAPI、CLI DTO、handler和migration保持closed
      contract。
    result: passed
    reason:
      text: HTTP/OpenAPI/CLI 复用现有认证、scope、审计、限流和 read permit；CLI 不接收
        token、不直连上游，contract closed。
      truncated: false
  - id: A10
    source: brief.md
    text: A10：bridge state和review正文服从knowledge privacy owner，Outbox服从generation
      fence；barrier后旧consumer、readback或review
      commit不能恢复正文。readiness独立报告notesync降级且不使PostgreSQL、知识、教学或查询整体not-ready，并明确外部vault副本不属于服务端清除证明。
    result: passed
    reason:
      text: bridge state 属于 knowledge privacy owner，Outbox 受 generation
        fence；readiness 仅降级 notesync，外部 vault 清理边界明确。
      truncated: false
  - id: A11
    source: brief.md
    text: A11：固定上游候选场景验证Bearer认证、`p:rest c:CLI
      f:note_r,note_w`和vault限制、业务envelope、create-only、publish/readback、旧消息、remote
      drift、outage/response-loss和显式导入；fake/httptest只覆盖故障矩阵，不能替代真实Fast Note Sync
      `3.6.1`证据。
    result: passed
    reason:
      text: 真实候选第二阶段使用 production PostgreSQL Store、knowledge
        Service、ReviewService、Consumer 和 real Client，验证 drift -> accept_remote
        -> import -> Outbox -> exact readback、mapping 前进且零 open review。
      truncated: false
  - id: A12
    source: brief.md
    text: A12：实现严格按S1真实client/contract、S2 outbound publication、S3 explicit
      import/review、S4 candidate integration推进。每批只运行能证伪当前行为的检查；真实Fast Note
      Sync、完整PostgreSQL、race和独立Verifier只在对应稳定边界运行一次并复用未失效证据。
    result: passed
    reason:
      text: S1-S4 实现与证据完整；Runtime 六项通过，同 fingerprint 的 real upstream、完整 db-core、race 与
        cross-build 证据有效。
      truncated: false
  - id: A13
    source: specs/notesync-bridge/spec.md
    text: "`notesync-bridge` publishes accepted canonical knowledge revisions to
      Fast Note Sync and imports Obsidian changes only through explicit review.
      PostgreSQL remains authoritative for KnowledgeRevision, stable
      document/node identity, publication order, review decisions and Outbox.
      The supported contract is Fast Note Sync Service `3.6.1` at commit
      `7a6c78792c631f999c8a5f725bba5dd7235d6688` with Obsidian plugin `2.4.0` at
      commit `f2b15c09d34e621d2d97ad526fdee03460bac151`; production uses the
      actual `GET /api/version`, `GET /api/health`, `GET /api/vault`, `GET
      /api/note`, `GET /api/notes` and `POST /api/note` routes with
      `Authorization: Bearer <token>`, `X-Client: CLI`, and `p:rest c:CLI
      f:note_r,note_w` plus configured vault restriction. Detailed upstream
      source evidence and the capability matrix are maintained in
      `docs/design/notesync-bridge.md`."
    result: passed
    reason:
      text: PostgreSQL 仍是 revision、identity、mapping、review 与 Outbox 权威；production
        composition 使用 pinned REST client 和真实 stores。
      truncated: false
  - id: A14
    source: specs/notesync-bridge/spec.md
    text: A successful canonical commit atomically enqueues one monotonic,
      generation-bound Outbox intent per changed stable document, while remote
      I/O runs after commit. The consumer suppresses stale revision/generation
      messages, uses create-only for an absent first target, and updates only
      after exact remote content matches the durable publication base; observed
      drift, deletion or collision creates review instead of overwriting. Every
      mutation requires exact readback, and response loss is reconciled by GET
      before applied/retry/conflict is decided. Fast Note Sync `3.6.1` has no
      atomic expected-version/CAS, so the upstream GET/POST concurrency window
      remains a documented limit rather than a false guarantee.
    result: passed
    reason:
      text: 原子入队、stale suppression、create-only、durable-base preflight、exact readback 与
        unknown-outcome reconciliation 均成立；CAS 限制未被夸大。
      truncated: false
  - id: A15
    source: specs/notesync-bridge/spec.md
    text: A bounded user-invoked preview reads real remote notes and freezes base,
      current canonical local and remote snapshots with source revision, stable
      identity, SHA-256 and basis hash. Resolution rechecks generation, local
      head and remote content, rejects stale basis, and allows only
      accept-remote, keep-canonical or supplied merged Markdown. Accept/merge
      enter the existing knowledge import with expected parent and identity
      review to create a new immutable revision; no remote file, path, title,
      mtime, version or content hash can directly change canonical knowledge.
    result: passed
    reason:
      text: resolution 验证 frozen snapshots/basis/generation/head/remote；dedicated
        review_import intent 保存已解析 remote authority，避免旧 base/source marker 重开
        review。
      truncated: false
  - id: A16
    source: specs/notesync-bridge/spec.md
    text: Closed HTTP/OpenAPI and online Go CLI surfaces expose status, preview,
      review and resolution through existing device authentication, knowledge
      scopes, limits, audit and generation-stamped read permits; the CLI never
      receives the Fast Note Sync token or calls the upstream service directly.
      Publication mapping and review text belong to the knowledge privacy owner,
      Outbox obeys the generation fence, and old work cannot restore redacted
      content. Fast Note Sync remains an external copy whose vault, history and
      backups are not falsely included in the server's physical-erasure receipt.
      Dependency failure degrades only the notesync component and never blocks
      canonical knowledge, teaching or queries.
    result: passed
    reason:
      text: closed HTTP/OpenAPI/CLI 与 privacy/generation fences 完整；dependency
        仅局部降级，外部副本不计入服务器物理清除证明。
      truncated: false
  - id: A17
    source: specs/notesync-bridge/spec.md
    text: Delivery proceeds serially through S1 pinned client/capability, S2
      outbound publication, S3 explicit import/review and S4 candidate
      integration. Unit and httptest fixtures may falsify local parsing and
      state logic but cannot establish upstream compatibility; the stable
      candidate must run once against real Fast Note Sync Service `3.6.1` and
      verify authentication, vault scope, create-only, read/write/readback,
      stale Outbox suppression, remote drift, outage/response-loss and explicit
      import. PostgreSQL, race and independent verification remain bounded to
      their stable stage, while unrelated Nocturne, offline-sync, Compose and
      platform evidence is reused unless notesync changes invalidate it.
    result: passed
    reason:
      text: 稳定候选具备 Runtime、race、cross-build、完整 PostgreSQL 和 pinned 3.6.1 证据；新增真实
        production import/store/consumer 闭环补齐 iteration 1 缺口。
      truncated: false
