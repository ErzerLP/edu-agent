  - id: A2
    source: brief.md
    text: A2：每个 evidence manifest
      绑定候选源码摘要、runner与lock摘要、测试选择、Go/Docker/Compose/Skopeo版本、OS/arch、开始/结束时间、脱敏日志SHA-256和终态。resume只接受字段完整、日志hash匹配且所有输入相同的
