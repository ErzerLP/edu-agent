  - id: A12
    source: specs/platform-foundation/spec.md
    text: "`platform-foundation` 提供单进程 Go 服务、PostgreSQL、HTTP、设备身份、模型网关和 Outbox
      基础。后续业务包通过端口使用这些能力，不绕过应用层直接依赖 transport 或数据库实现。"
    result: passed
    reason:
      text: 单进程服务组合 PostgreSQL、HTTP、设备身份和模型网关，并提供独立 Outbox 基础包；transport 通过应用接口使用这些能力。
      truncated: false
  - id: A13
    source: specs/platform-foundation/spec.md
    text: 业务端口由消费方定义。`identity` 拥有配对码、设备和令牌。`platform/postgres` 只提供连接、事务和 migration
      支持。`platform/outbox` 拥有外部写入意图的通用投递状态，不拥有具体业务 payload 语义。`integrations/llm`
      实现模型调用契约。`transport/httpapi` 只完成 HTTP 映射。
    result: passed
    reason:
      text: identity 拥有配对和设备数据，postgres 负责连接，outbox 分离 payload 与通用投递状态，llm 实现模型契约，HTTP
        层保持协议映射职责。
      truncated: false
  - id: A14
    source: specs/platform-foundation/spec.md
    text: 服务从环境变量读取监听地址、public base URL、PostgreSQL URL、模型 base
      URL、模型名、模型密钥、上下文窗口、超时和安全开关。缺失必需配置、URL 无效、上下文窗口低于 profile
      要求或监听策略不安全时，启动返回可诊断错误。
    result: passed
    reason:
      text: 所列配置均从环境读取并执行必填、URL、正数、模型配置完整性和最小上下文校验，错误可诊断且不会回显密钥。
      truncated: false
  - id: A15
    source: specs/platform-foundation/spec.md
    text: 默认监听 `127.0.0.1:8080`。配置非 loopback 地址时，public base URL 必须是
      HTTPS。仅当显式启用开发用途的不安全开关时允许非 loopback HTTP，服务在启动日志和健康状态中持续暴露安全告警。
    result: passed
    reason:
      text: 默认地址、HTTPS public URL 策略、显式开发不安全开关、启动 warning 和 readiness warning
        均有实现及单元测试。
      truncated: false
  - id: A16
    source: specs/platform-foundation/spec.md
    text: 服务按顺序加载配置、日志、PostgreSQL、migration、应用服务和 HTTP
      server。关闭时停止接收请求，等待有界时间内的在途操作并关闭数据库连接。
    result: passed
    reason:
      text: 启动顺序为配置、日志、数据库、migration、应用依赖和 HTTP server；Shutdown 使用有界 context
        停止接收请求，随后关闭数据库池。
      truncated: false
  - id: A17
    source: specs/platform-foundation/spec.md
    text: 第一版只维护 PostgreSQL 方言。migration 是按版本排序、不可重写的 SQL 文件。应用启动可以检查 migration
      状态，开发 Compose 可以执行 migration；生产不会静默忽略失败 migration。
    result: passed
    reason:
      text: 仅实现 PostgreSQL；migration 按六位版本排序、记录 checksum 并拒绝重写，启动时选择执行或严格
        Check，失败不会静默忽略。
      truncated: false
  - id: A18
    source: specs/platform-foundation/spec.md
    text: 基础 schema 包含设备、配对码和 Outbox 所需表。时间使用 UTC。关键幂等约束由数据库唯一索引保证。敏感 payload
      与最小审计元数据使用不同字段，为后续 redaction 留出边界。
    result: passed
    reason:
      text: migration 包含 devices、pairing_codes、device_tokens 和 outbox_messages；使用
        TIMESTAMPTZ、唯一约束，并将 Outbox payload 与 audit_metadata 分列。
      truncated: false
  - id: A19
    source: specs/platform-foundation/spec.md
    text: "`/livez` 只证明进程事件循环可响应。`/readyz` 检查必要依赖并返回组件化 JSON。PostgreSQL 不可用时
      readiness 失败。模型端点未配置或探测失败时按配置返回 degraded 或
      not-ready，不能伪装为健康。响应不泄露连接串、密钥或内部错误堆栈。"
    result: failed
    reason:
      text: 健康响应本身分层且脱敏，但 readiness 复用默认缓存 15 分钟的
        Client.Probe；必需模型在一次成功探测后即使端点下线，仍可能长期报告 healthy，而不是 not_ready。
      truncated: false
  - id: A20
    source: specs/platform-foundation/spec.md
    text: 配对码只能通过服务器本地管理命令生成。配对码至少包含 128 bit
      随机熵，默认十分钟过期，只能成功消费一次，并具有失败尝试上限。数据库只保存配对码哈希、过期时间、消费时间和尝试计数。
    result: failed
    reason:
      text: 本地命令、128-bit secret、十分钟默认 TTL、哈希字段和一次性消费已实现；但 Serializable
        并发失败未重试，错误尝试事务可因 40001 回滚，无法保证并发情况下的失败尝试上限。
      truncated: false
  - id: A21
    source: specs/platform-foundation/spec.md
    text: 设备提交配对码与设备显示名后换取至少 256 bit 的随机 bearer token。令牌只在签发响应中出现一次，数据库保存 SHA-256
      哈希、设备身份、作用域、创建时间、最后使用时间和吊销时间。认证使用常量时间比较。吊销立即阻止后续请求，且不影响其他设备。
    result: passed
    reason:
      text: 令牌使用 crypto/rand 生成 256 bit 值，仅签发响应返回明文；数据库保存 SHA-256
        哈希、设备、scope、时间和吊销状态，并执行常量时间比较及设备级事务吊销。
      truncated: false
  - id: A22
    source: specs/platform-foundation/spec.md
    text: 认证 middleware 解析 bearer token、执行设备和作用域检查、更新受节流的最后使用时间，并把身份放入请求
      context。配对与认证失败按客户端/IP 限流，错误响应不区分可用于枚举的内部原因。
    result: failed
    reason:
      text: middleware 能解析 bearer、检查 scope、写 context 并节流
        last_used_at，但认证限流只在数据库认证失败后改变响应，不能阻止后续认证尝试；并发配对序列化错误还可能返回 500 而非统一
        pairing_failed。
      truncated: false
  - id: A23
    source: specs/platform-foundation/spec.md
    text: 模型网关面向 OpenAI-compatible Chat Completions 风格接口。必需能力是 system/user/assistant
      消息、非流式响应、可解析的结构化 JSON、稳定错误分类、请求超时和配置的最低上下文窗口。原生 JSON
      Schema、流式响应和工具调用是可协商能力，工具调用不作为核心教学实现的前提。
    result: passed
    reason:
      text: 客户端使用 /v1/chat/completions，发送 system/user/assistant、stream=false
        和结构化响应格式，具有超时、上下文下限和稳定错误分类；流式与工具能力不作为核心前提。
      truncated: false
  - id: A24
    source: specs/platform-foundation/spec.md
    text: 探测返回 capability 与明确的不兼容原因。fake model server 覆盖成功、无效 JSON、schema
      不匹配、401、429、5xx、超时和连接失败。模型密钥只进入 Authorization 请求头，日志和错误必须脱敏。
    result: passed
    reason:
      text: 探测返回 capability 和稳定原因；fixture/test 覆盖成功、无效 JSON、schema
        mismatch、401、429、5xx、超时及停服连接失败，Authorization 密钥和上游响应体不会进入错误或客户端响应。
      truncated: false
  - id: A25
    source: specs/platform-foundation/spec.md
    text: Outbox 记录业务类型、聚合 ID、幂等键、单调
      revision、generation、payload、状态、可重试时间、尝试次数、最后错误类别和时间。状态至少支持
      pending、processing、applied、dead。领取使用 PostgreSQL 锁避免同一消息并发执行。
    result: failed
    reason:
      text: 字段、状态和 SKIP LOCKED 领取已实现，但 claim 没有所有权 token；MarkApplied/MarkFailed 仅按 id
        和 processing 匹配。租约过期并被另一 worker 重新领取后，旧 worker
        仍可完成状态更新，导致并发执行和新领取结果被旧结果覆盖。
      truncated: false
  - id: A26
    source: specs/platform-foundation/spec.md
    text: 具体适配器负责目标幂等，通用 worker 负责有界指数退避、jitter、尝试上限和死信。旧 revision 或旧 generation
      是否可应用由消费适配器与业务 fence 共同判断。
    result: passed
    reason:
      text: Worker 调用消费方 CanApply fence，提供有界指数退避、jitter、最大尝试和永久错误死信；旧
        revision/generation 的业务判定明确留给消费适配器。
      truncated: false
  - id: A27
    source: specs/platform-foundation/spec.md
    text: OpenAPI 描述健康、配对、设备查询/吊销和模型能力探测的基础端点。错误使用稳定机器码、用户可读消息和 request
      ID。响应不暴露密钥、哈希或内部数据库细节。
    result: failed
    reason:
      text: 端点和错误 envelope 已描述，但 OpenAPI 的 display_name maxLength=100 按 Unicode
        字符计数，实际 Service 使用 len 字节计数，合法的多字节名称会被错误拒绝；实际可返回的 500 响应也未在这些操作中声明。
      truncated: false
  - id: A28
    source: specs/platform-foundation/spec.md
    text: "`server/Dockerfile` 采用多阶段构建并使用非 root 运行用户。`deploy/compose.yaml` 启动
      PostgreSQL 和 Go 服务，使用健康检查、持久卷和环境变量，不在仓库写入真实密钥。`.env.example` 只包含占位符和安全说明。"
    result: failed
    reason:
      text: Dockerfile 为多阶段非 root，Compose 有 PostgreSQL、健康检查、持久卷和环境变量；但冻结契约要求仓库根
        .env.example，实际只有 deploy/env.example，根文件确认不存在。
      truncated: false
  - id: A29
    source: specs/platform-foundation/spec.md
    text: 单元测试覆盖配置、监听策略、配对生命周期、令牌哈希/吊销、认证、限流、日志脱敏、模型错误分类和 Outbox 状态转换。HTTP 测试使用
      `httptest`，模型契约使用 fake server。PostgreSQL 集成测试在可用环境中运行
      migration、唯一约束、并发配对消费和 Outbox 领取。
    result: passed
    reason:
      text: 已提交并由 Runtime 通过的单元/httptest 覆盖配置、监听、身份生命周期、认证、限流、脱敏、模型错误和 Outbox；另有受
        TEST_DATABASE_URL 控制的 migration、并发配对、唯一约束及并发 claim 集成测试。
      truncated: false
  - id: A30
    source: specs/platform-foundation/spec.md
    text: 本机缺少 Docker 时，Compose 启动检查必须明确记录为未运行；静态解析与 Go 测试不能替代真实容器验收。
    result: passed
    reason:
      text: Comet Runtime 记录明确将 PostgreSQL 集成、Docker Compose 启动和 race test 标为
        not-run，并分别说明缺少 TEST_DATABASE_URL/PostgreSQL、Docker WSL integration 和
        gcc；未将静态检查冒充真实运行。
      truncated: false
