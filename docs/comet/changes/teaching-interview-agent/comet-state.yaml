      text: 正式规格要求的学习、评估、投影与事件实体均已实现。
      truncated: false
  - id: A46
    source: specs/learning-agent/spec.md
    text: 误区是带证据、置信状态和反证能力的 hypothesis，不是不可修改的用户事实。
    result: passed
    reason:
      text: 误区按带证据、可反证的版本化hypothesis管理。
      truncated: false
  - id: A47
    source: specs/learning-agent/spec.md
    text: 客户端提交 operation 或 observation。服务端在一个事务中使用 `(device_id, operation_id)` 写入
      Inbox 并永久去重，检查 aggregate、expected version、Activity 和知识 revision，生成服务端
      canonical Learning Event，更新需要 read-your-writes 的核心投影，并写入必要 Outbox。
    result: passed
    reason:
      text: 操作在同一事务完成去重、版本检查、事件、投影和Outbox。
      truncated: false
  - id: A48
    source: specs/learning-agent/spec.md
    text: 客户端不能生成评分、掌握更新、路线 revision 或其他权威事件。离线 `occurred_at` 是不可信展示信息，服务端同时记录可信
      `received_at`。
    result: passed
    reason:
      text: 客户端不能生成权威事件，服务端记录可信received_at。
      truncated: false
  - id: A49
    source: specs/learning-agent/spec.md
    text: “可重建”只指由 Learning Event Log 派生的学习投影，不包括 Nocturne 内容或模型生成摘要。重建输入包含事件 schema
      version、严格 event sequence、不可变知识/node revision、reducer、接纳 policy、复习
      policy、Assessment 和 Evidence 引用。
    result: passed
    reason:
      text: 重放输入绑定事件版本、严格序列、不可变引用和策略版本。
      truncated: false
  - id: A50
    source: specs/learning-agent/spec.md
    text: Projection 保存 checkpoint、`as_of_event_seq` 和版本。schema 变化必须提供 upcaster
      或明确停止支持旧版本。业务纠错通过
      `AssessmentOverridden`、`EvidenceInvalidated`、`EventRedacted`
      等补偿事件完成。派生投影不能被直接手工改值。
    result: passed
    reason:
      text: 投影版本、checkpoint、upcaster及补偿事件语义完整。
      truncated: false
  - id: A51
    source: specs/learning-agent/spec.md
    text: M1 使用 `unseen / learning / provisional /
      retained`，并同时展示有效证据数量、类型、帮助程度、最近时间和不确定性。单次 Assessment 不能直接建立
      `retained`，至少需要跨时间的主动回忆证据。
    result: passed
    reason:
      text: 四态掌握模型及跨时间主动回忆retained门槛正确。
      truncated: false
  - id: A52
    source: specs/learning-agent/spec.md
    text: M1 使用版本化固定间隔策略，默认阶梯为可配置的 `1d / 3d / 7d / 14d / 30d`。`ReviewPresented`
      不等于成功，只有后续 accepted evidence
      才能推进复习状态。系统不在缺少校准数据时声称精确预测遗忘。未来策略必须保留版本以支持历史解释和重放。
    result: passed
    reason:
      text: 固定间隔策略版本化，ReviewPresented本身不推进复习。
      truncated: false
  - id: A53
    source: specs/learning-agent/spec.md
    text: Nocturne 是 M1 正式 sidecar，使用固定版本和镜像 digest。它可以与 Go 服务共用 PostgreSQL
      实例，但必须使用独立数据库、账号和迁移生命周期，禁止跨库读取业务表。Go 服务通过受认证的适配器调用固定 REST/MCP
      capability，并运行契约测试。上游升级前必须重新验证 capability matrix。Nocturne Dashboard
      可以部署，但不是教学业务管理界面。
    result: passed
    reason:
      text: Nocturne版本、镜像digest、独立数据库和能力矩阵均锁定。
      truncated: false
  - id: A54
    source: specs/learning-agent/spec.md
    text: 生命周期是 `MemoryCandidate -> admitted|rejected -> MemoryRecord ->
      superseded|deleted`。每个 Candidate 包含来源事件、提议内容、敏感级别、有效期、候选 URI、提议者和理由。
    result: passed
    reason:
      text: MemoryCandidate到Record再到superseded或deleted生命周期完整。
      truncated: false
  - id: A55
    source: specs/learning-agent/spec.md
    text: 用户明确陈述、稳定、非敏感的交互偏好或时间约束可以按版本化规则自动
      admitted。模型推断、敏感信息、长期背景和生成摘要必须先审阅。生成摘要标记为非权威模型工件，不得伪装成用户陈述。原始聊天、完整答题、掌握度、误区结论、路线和复习队列禁止写入
      Nocturne。
    result: passed
    reason:
      text: 仅明确稳定非敏感偏好可自动准入，其余必须审阅。
      truncated: false
  - id: A56
    source: specs/learning-agent/spec.md
    text: 外部写入使用至少一次 Outbox。每条消息包含幂等键、实体 revision 和 generation。`applied`
      表示固定契约已确认，`queued` 表示教学事务成功且长期记忆写入等待重试，`rejected` 表示策略或永久契约错误且不再自动重试。
    result: passed
    reason:
      text: 记忆Outbox绑定幂等键、revision、generation及三态结果。
      truncated: false
  - id: A57
    source: specs/learning-agent/spec.md
    text: 旧 revision 或旧 generation 的消息不得覆盖新值或复活已删除记忆。超过重试预算的消息进入死信并可人工重放。
    result: passed
    reason:
      text: 旧revision和generation被fence，死信支持受控人工重放。
      truncated: false
  - id: A58
    source: specs/learning-agent/spec.md
    text: 隐私清除和业务纠错是不同操作。清除时先建立 tombstone/generation barrier，再取消相关未执行 Outbox/Inbox
      payload，清除或加密销毁活动数据库中的可识别正文和引用，清除索引、缓存和查询投影中的内容，在 Nocturne 中解除所有路径并清理相关
      orphan 与历史版本，重新查询验证后生成逐存储位置的删除回执。
    result: passed
    reason:
      text: 清除先建立barrier，再清理全部owner与Nocturne引用。
      truncated: false
  - id: A59
    source: specs/learning-agent/spec.md
    text: 删除回执记录备份最长 30 天的最终不可恢复截止时间。事件只保留最小审计元数据，正文使用可 redaction 的 payload 引用。重放遇到
      redacted 事件时按版本化 no-op
      或补偿语义处理。系统不能承诺清除已发送给外部模型供应商的数据，也不能在备份截止时间前宣称备份已彻底清除。
    result: passed
    reason:
      text: 删除回执、最小审计、redacted replay及外部限制如实表达。
      truncated: false
  - id: A60
    source: specs/learning-agent/spec.md
    text: OpenAPI 是 HTTP 契约。M1 的模型 profile 明确约定 Chat Completions 风格消息、结构化 JSON
      输出、错误语义、超时和最低上下文要求。原生 JSON Schema 与流式输出可以有能力协商，工具调用不是核心教学流程的必需能力。fake
      model server 用于确定性测试。
    result: passed
    reason:
      text: OpenAPI与模型profile明确消息、JSON、错误、超时和能力协商。
      truncated: false
  - id: A61
    source: specs/learning-agent/spec.md
    text: M1 Go CLI 支持配对、设备状态、注销、导入知识、设置目标、开始或继续教学、回答、查看 rubric 评估、确认或覆盖 provisional
      结果、自由提问、显式转为测验、恢复 focus，以及查看路线、证据和复习。
    result: passed
    reason:
      text: CLI完整支持配对、学习、评估裁决、自由问答和查询。
      truncated: false
  - id: A62
    source: specs/learning-agent/spec.md
    text: CLI 默认使用低颜色、无显眼学习标识的文本模式并支持快速清屏。清屏只清除应用当前显示，不承诺清除终端 scrollback、Shell
      历史或系统日志。
    result: passed
    reason:
      text: CLI默认低颜色、中性文本并正确声明清屏能力边界。
      truncated: false
  - id: A63
    source: specs/learning-agent/spec.md
    text: 面向 CLI 和未来 Web 的查询返回时间线、会话、当前及历史路线、知识节点状态、最近有效证据、误区
      hypothesis、今日与未来复习、`as_of_event_seq`、projection version、knowledge
      revision，以及 rebuilding、degraded 和 incomplete 标记。
    result: passed
    reason:
      text: 查询覆盖时间线、路线、节点、证据、误区和复习元数据。
      truncated: false
  - id: A64
    source: specs/learning-agent/spec.md
    text: 统计时间只能标记为估计值，不能把不可信离线设备时钟当作精确学习时长。
    result: passed
    reason:
      text: 学习时间明确为估算且不使用不可信设备时钟排序。
      truncated: false
  - id: A65
    source: specs/learning-agent/spec.md
    text: 离线客户端只保存服务端预签发 Activity 和 client operation/observation。每项包含
      `operation_id`、`device_id`、`device_seq`、`aggregate_id`、`expected_version`、`activity_revision`、`occurred_at`
      和 payload schema version。
    result: passed
    reason:
      text: 离线项包含预签发Activity和完整操作、设备及版本字段。
      truncated: false
  - id: A66
    source: specs/learning-agent/spec.md
    text: 服务端分别返回操作是否存档和证据是否接纳。重复操作不重复计分。过期知识 revision 的 Attempt 可以保留审计，但默认
      provisional。多设备完成同一 Activity 时按明确 policy 处理，不按设备时钟静默覆盖。
    result: passed
    reason:
      text: 离线响应区分存档与Evidence，重复和陈旧项按策略处理。
      truncated: false
  - id: A67
    source: specs/learning-agent/spec.md
    text: 系统固定 Fast Note Sync 最低版本、测试版本和 API capability matrix。发布 Markdown 包含 source
      revision，Outbox 使用单调 revision，旧消息不能覆盖新笔记。Fast Note Sync 不是 canonical
      知识存储或冲突协调器。
    result: passed
    reason:
      text: NoteSync版本矩阵、source revision和单调发布语义完整。
      truncated: false
  - id: A68
    source: specs/learning-agent/spec.md
    text: Obsidian 修改只通过显式导入进入系统。系统根据 base、local 和 remote revision 生成三方差异，冲突必须审阅。
    result: passed
    reason:
      text: Obsidian变更仅经显式三方审阅进入canonical知识。
      truncated: false
  - id: A69
    source: specs/learning-agent/spec.md
    text: MCP 只包装现有应用用例，共用设备身份、授权、审计和错误语义。通用 Agent 不能绕过 Assessment 接纳、知识修改审批或 Memory
      Candidate 准入策略。
    result: passed
    reason:
      text: MCP共用认证、审计和应用服务且不能绕过业务门禁。
      truncated: false
  - id: A70
    source: specs/learning-agent/spec.md
    text: Agent 先生成带来源、base revision、diff、lineage 影响和风险等级的
      proposal。新增和局部低风险修订可以按规则自动应用。移动、重大改写、拆分、合并和删除必须审批。应用后产生新 canonical
      revision，回退通过新的反向 revision 完成而不删除历史。与学习证据相关的 lineage 迁移必须独立审批。
    result: passed
    reason:
      text: Agent proposal绑定来源、diff和风险，高风险操作必须审批。
      truncated: false
  - id: A71
    source: specs/learning-agent/spec.md
    text: 服务默认监听 loopback。非 loopback 部署应由 HTTPS 反向代理终止 TLS。显式不安全开关仅供受信网络并产生持续告警。
    result: passed
    reason:
      text: 服务默认loopback，非loopback明文必须显式启用并持续告警。
      truncated: false
  - id: A72
    source: specs/learning-agent/spec.md
    text: 首次配对码由服务器本地管理命令生成，具有高熵、短
      TTL、一次性和尝试限流。设备令牌使用高熵随机值，只在签发时返回，数据库只保存哈希。令牌包含设备身份和作用域，可以单独吊销。
    result: passed
    reason:
      text: 配对码与设备令牌满足高熵、短期、哈希存储和独立吊销。
      truncated: false
  - id: A73
    source: specs/learning-agent/spec.md
    text: Nocturne、Fast Note Sync 和模型凭据只保存在服务端 secret/config provider
      中，不返回客户端、不进入日志或导出。HTTP 与 MCP 在进入应用用例前执行统一认证、授权、速率限制和审计。
    result: passed
    reason:
      text: 外部凭据仅存服务端，HTTP与MCP统一认证授权和审计。
      truncated: false
  - id: A74
    source: specs/learning-agent/spec.md
    text: 领域与应用规则使用单元测试。PostgreSQL 使用真实数据库集成测试，不维护 SQLite 生产方言。模型使用 fake server 验证
      schema 错误、低置信、超时、重试和模型升级回归。
    result: passed
    reason:
      text: 单元、真实PostgreSQL、fake模型及固定依赖契约策略均成立。
      truncated: false
  - id: A75
    source: specs/learning-agent/spec.md
    text: 知识树比较增量更新与全量重建，学习投影比较增量 reducer 与从零重放。Inbox/Outbox、设备认证、Nocturne、删除
      fence、Fast Note Sync 和离线同步执行重复、乱序、并发与故障注入测试。外部依赖按固定版本运行契约测试，升级不自动视为兼容。
    result: passed
    reason:
      text: 重建对比、幂等、乱序、并发、故障注入和外部锁定证据完整。
      truncated: false
