 {id:'binary',name:'二分查找与边界',goal:'独立写出二分查找，并解释左右边界为什么这样更新',emoji:'💻',color:'green',date:'昨天',topic:'binary',sources:[source('bs-1','二分查找学习笔记','text','已解析','文本 · 区间与边界',['二分查找通过每次排除一半的候选区间来定位目标。','对于闭区间 [left, right]，循环条件为 left ≤ right。若中间元素小于目标，则令 left = mid + 1；否则令 right = mid − 1。','数组需要有序，才能根据比较结果安全地排除一半。'],1,'学习笔记整理了闭区间二分查找的边界更新'),source('bs-2','算法讲义：查找.pdf','pdf','已解析','第 4 章 · 查找',['在有序数组中，二分查找的时间复杂度为 O(log n)。','循环不变量保证目标若存在，就始终在当前搜索区间中。'],1,'算法讲义用循环不变量解释二分查找'),source('bs-3','边界测试清单','text','已解析','文本 · 测试清单',['检查空数组、单元素数组、查找第一个或最后一个元素、目标不存在等情况。','当查找第一个大于等于目标的元素时，可以使用左闭右开区间。'],0,'测试清单覆盖了空数组与端点等边界情况')]},

const state={workspace:null,conversation:null,activeTab:'pChat',openSource:null,noteSaved:new Set()};

function newConversation(title='新的对话'){return {id:uid('conversation'),title,messages:[],started:false}}
function initializeWorkspace(ws){if(ws.conversations)return;const empty=newConversation();const previous=newConversation(ws.topic==='algebra'?'基与维数 · 昨天':'上次的学习');previous.started=true;previous.messages=[{id:uid('message'),type:'user',text:ws.topic==='algebra'?'一组基为什么不能有多余的向量？':'帮我回顾一下这份资料的关键点。'},{id:uid('message'),type:'ai',html:ws.topic==='algebra'?`<p>基需要同时满足<strong>线性无关</strong>和<strong>张成空间</strong>。如果其中一个向量能用其他向量表示，它就是多余的；删去它之后，能表示的范围并没有变。${cite(ws.sources[1],ws)}</p><p>可以想一想：在平面中已经有两个独立的方向，再加入第三个向量，会带来新的方向吗？</p>`:`<p>${escapeHtml(ws.sources[0]?.summary||ws.goal)}。${cite(ws.sources[0],ws)}</p><p>我们可以选一个具体例子，把这些要点串起来。</p>`}];ws.conversations=ws.isNew?[empty]:[empty,previous];ws.currentConversation=empty.id;ws.lastConversation=ws.isNew?null:previous.id;ws.outputs=ws.sources.length?[{id:uid('output'),type:'guide',title:ws.topic==='algebra'?'学习指南：线性无关与基':`学习指南：${ws.name}`,meta:`${ws.sources.length} 个来源 · 2 小时前`,html:guideContent(ws)},{id:uid('output'),type:'note',title:ws.topic==='algebra'?'我的笔记：秩与线性无关的关系':'我的第一条阅读笔记',meta:'笔记 · 昨天',html:ws.topic==='algebra'?'<p>把向量排成矩阵，如果秩等于向量的个数，这组向量就线性无关。</p><p>还要记住：两两不共线，不能保证整组线性无关。</p>':`<p>${escapeHtml(ws.goal)}</p>`}]:[]}
function renderHome(){const grid=$('#workspaceGrid');grid.innerHTML=`<button class="workspace-card new-card" id="newWorkspaceCard" aria-label="新建学习区"><span class="plus-circle">${icon('plus')}</span><strong>新建学习区</strong></button>`+workspaces.map(ws=>`<button class="workspace-card ${ws.color}" data-open-workspace="${ws.id}" aria-label="${escapeHtml(ws.name)}，${ws.sources.length} 个来源"><span class="card-icon">${ws.emoji}</span>${icon('arrow','card-arrow')}<h2>${escapeHtml(ws.name)}</h2><div class="card-meta">${ws.sources.length} 个来源 · ${ws.date}</div></button>`).join('');$('#newWorkspaceCard').onclick=openCreateWorkspace}
function openWorkspace(id){const ws=workspaces.find(item=>item.id===id);if(!ws)return;state.workspace=ws;initializeWorkspace(ws);state.conversation=ws.conversations.find(c=>c.id===ws.currentConversation);document.body.classList.add('in-workspace');$('#home').classList.add('hidden');$('#homeTopLink').classList.add('hidden');$('#workspace').classList.remove('hidden');$('#workspaceTitle').classList.remove('hidden');$('#workspaceSettings').classList.remove('hidden');$('#mobileTabs').classList.remove('hidden');$('#workspaceTitle').textContent=ws.name;$('#sourceReader').classList.add('hidden');state.openSource=null;closeDrawer();switchTab('pChat');renderSources();renderConversation();showStudioHome();renderStudio()}

function renderSources(){const ws=state.workspace;$('#sourceTotal').textContent=ws.sources.length;$('#sourceList').innerHTML=ws.sources.length?ws.sources.map((s,i)=>`<div class="source-row ${state.openSource===s.id?'selected-source':''}"><button class="source-open" data-source="${s.id}"><span class="file-type ${s.type}">${{pdf:'PDF',web:'WEB',text:'TXT',search:'搜'}[s.type]}</span><span class="source-info"><span class="source-name"><span class="source-index">${i+1}.</span>${escapeHtml(s.title)}</span><span class="source-status ${s.status==='部分正文'?'partial':s.status==='已采纳'?'accepted':''}">${s.status}</span></span></button><input type="checkbox" data-select-source="${s.id}" ${s.selected?'checked':''} aria-label="选择 ${escapeHtml(s.title)}"></div>`).join(''):'<div class="empty-sources">暂无来源</div>';updateSourceCount()}
function updateSourceCount(){const ws=state.workspace,n=selectedSources().length;$('#sourceCount').textContent=`基于 ${n} 个来源`;$('#allSources').checked=!!ws.sources.length&&n===ws.sources.length;$('#allSources').indeterminate=n>0&&n<ws.sources.length;$('#allSources').disabled=!ws.sources.length;if(!state.conversation.messages.length)renderConversation()}
function openSource(id){const ws=state.workspace,s=ws.sources.find(item=>item.id===id);if(!s)return;state.openSource=id;$('#sourceReader').innerHTML=`<div class="reader-top"><span>来源 ${ws.sources.indexOf(s)+1} · 原文</span><button class="icon-button" id="closeSourceReader" aria-label="收起原文">${icon('close')}</button></div><h3>${escapeHtml(s.title)}</h3><div class="reader-location">${escapeHtml(s.location)}</div>${s.paragraphs.map((p,i)=>`<p>${i===s.highlight?`<mark>${escapeHtml(p)}</mark>`:escapeHtml(p)}</p>`).join('')}`;$('#sourceReader').classList.remove('hidden');$('#closeSourceReader').onclick=()=>{$('#sourceReader').classList.add('hidden');state.openSource=null;renderSources()};renderSources();if(matchMedia('(max-width:900px)').matches)switchTab('pSources');$('#sourceReader').scrollTop=0}
function overviewContent(){const ws=state.workspace,ss=selectedSources();let summary=ss.length?`${escapeHtml(ss[0].summary)}${cite(ss[0])}。${ss[1]?`${escapeHtml(ss[1].summary)}${cite(ss[1])}。`:''}${ss.length>2?`其他 ${ss.length-2} 份资料提供了更多例子与理解角度${cite(ss[ss.length-1])}。`:''}`:'添加一份资料，或直接聊聊你想学会的内容。';const questions=ws.topic==='algebra'?['线性无关到底是什么意思？','怎样判断一组向量能不能构成基？','线性无关与矩阵的秩有什么关系？']:ws.topic==='binary'?['二分查找为什么每次能排除一半？','左右边界应该怎么更新？','有哪些容易遗漏的边界情况？']:['这些资料最重要的观点是什么？','能用一个具体例子解释吗？','怎样把这些内容联系起来？'];return `<div class="overview"><h2 class="overview-heading">${icon('spark')}学习区概要</h2><h3>${escapeHtml(ws.name)}</h3><div class="goal-line"><span class="goal-label">学习方向</span><span>${escapeHtml(ws.goal)}</span></div><div class="overview-summary">${summary}</div><div class="suggestion-label">从一个问题开始</div><div class="suggestions">${questions.map(q=>`<button class="suggestion" data-question="${escapeHtml(q)}">${icon('chat')}<span class="question-text">${q}</span>${icon('arrow','arrow')}</button>`).join('')}</div><div class="overview-actions"><button class="pill primary" id="startLearning">${icon('spark')}开始学习</button><button class="pill outline" id="continueLearning">${icon('history')}继续上次</button></div></div>`}
function renderMessage(m){if(m.type==='user')return `<div class="user-message"><div class="user-bubble">${escapeHtml(m.text)}</div></div>`;if(m.type==='ai')return `<article class="ai-message" data-message-id="${m.id}"><div class="ai-author"><span class="ai-star">${icon('spark')}</span>学习助手</div><div class="ai-body">${m.html}</div>${messageActions(m)}</article>`;if(m.type==='practice')return practiceContent(m);if(m.type==='feedback')return `<article class="feedback-card" data-message-id="${m.id}"><div class="feedback-heading">${icon('check-circle')}${m.title}</div>${m.html}${messageActions(m)}</article>`;return ''}

function answerHtml(question,ws=state.workspace){const ss=selectedSources(ws),first=ss[0];if(!first)return '<p>我们可以先从你想弄懂的问题开始。添加或选择一份来源后，我也能结合资料中的具体内容和你讨论。</p>';if(ws.topic!=='algebra')return `<p>${escapeHtml(first.summary)}。${cite(first,ws)}</p><p>${escapeHtml(first.paragraphs[first.highlight]||first.paragraphs[0])}${cite(first,ws)}</p><p>你可以试着用自己的话复述这个观点，再选一个具体情境来解释它。</p>`;const definition=ss.find(s=>s.id==='la-1')||first,basis=ss.find(s=>s.id==='la-2'),rank=ss.find(s=>s.id==='la-3'),intuition=ss.find(s=>s.id==='la-4')||definition;
 if(/例子|生活/.test(question))return `<p>把向量想成几种<strong>移动方向</strong>。你已经能向右走，也能向上走，那么“右上方”就可以由这两种移动组合得到。加入“右上方”并没有增加新的能力。${cite(intuition,ws)}</p><p>这就是线性相关的直觉：<strong>其中一个向量可以由其他向量拼出来</strong>。反过来，如果每个方向都不可替代，它们就线性无关。${cite(definition,ws)}</p>`;
 if(/基|维数/.test(question)&&basis)return `<p>一组向量构成<strong>基</strong>，需要同时满足两个条件：<strong>线性无关</strong>，以及<strong>能张成整个空间</strong>。${cite(basis,ws)}</p><p>比如在 R² 中，(1,0) 与 (0,1) 既没有多余的向量，又能组合出平面上的任意向量，所以它们是 R² 的一组基。</p>`;
 if(/秩|矩阵/.test(question)&&rank)return `<p>把每个向量作为矩阵的一列。<strong>矩阵的秩等于向量的个数</strong>，就说明这些列之间没有冗余，也就是线性无关。${cite(rank,ws)}</p><p>如果 3 个向量中有一个等于另外两个的和，那么只有 2 个独立方向，矩阵的秩就是 2。${cite(definition,ws)}</p>`;
 if(/总结/.test(question))return `<p>可以记住这条线索：<strong>有没有多余的向量 → 是否线性无关 → 能否构成基</strong>。${cite(intuition,ws)}</p><p>判断线性无关，可以检查零向量的线性组合是否只有全零系数。${cite(definition,ws)}${basis?`构成基还要保证能够张成整个空间。${cite(basis,ws)}`:''}</p>`;
 return `<p>我们先理解<strong>线性无关</strong>：一组向量中，没有哪一个可以由其他向量“拼出来”。每个向量都提供了一个不可替代的方向。${cite(intuition,ws)}</p><p>用数学语言说，c₁v₁ + … + cₖvₖ = 0 只有所有系数都为 0 才成立。这时向量组就线性无关。${cite(definition,ws)}</p><p>反过来，只要找到一个<strong>系数不全为 0</strong> 的组合得到零向量，就能说明它们线性相关。</p>`}

function createPractice(){const ws=state.workspace;return {id:uid('practice'),type:'practice',topic:ws.topic,prompt:ws.topic==='algebra'?'下面这组向量线性无关吗？请说明理由；如果线性相关，写出一个非平凡组合。':ws.topic==='binary'?'在有序数组 [1, 3, 5, 7, 9] 中查找 7。第一次取到中间值 5 后，你会怎样更新查找范围？':ws.topic==='http'?'DELETE 的第二次响应是 404。它还可能是幂等的吗？请说明理由。':`请用自己的话解释一个最重要的观点，并给出一个例子。`,submitted:false,answer:'',help:'',sourceIds:selectedSources().map(s=>s.id)}}
function practiceContent(m){return `<article class="practice-card" data-practice-id="${m.id}"><div class="practice-top"><div class="practice-label">${icon('note')}试着想一想</div><span class="practice-type">开放题</span></div><h3>${escapeHtml(m.prompt)}</h3>${m.topic==='algebra'?'<div class="exercise-vectors">v₁ = (1, 2, 0)　 v₂ = (0, 1, 1)　 v₃ = (1, 3, 1)</div>':''}<textarea class="practice-answer" aria-label="练习答案" placeholder="写下你的思路，不用急着答对…" ${m.submitted?'readonly':''}>${escapeHtml(m.answer)}</textarea><div class="form-error hidden" role="status"></div><div class="practice-footer">${m.submitted?`<span class="submitted-label">${icon('check')}已提交 · ${escapeHtml(m.help)}</span>`:`<label class="help-field">我得到的帮助<select aria-label="我得到的帮助"><option value="">请选择</option>${['独立完成','看过提示','参考了示例'].map(option=>`<option ${m.help===option?'selected':''}>${option}</option>`).join('')}</select></label><button class="pill tonal" data-submit-practice="${m.id}">提交答案${icon('arrow','small-icon')}</button>`}</div></article>`}
function submitPractice(id){const m=state.conversation.messages.find(item=>item.id===id);if(!m||m.submitted)return;const card=$(`[data-practice-id="${id}"]`),answer=card.querySelector('textarea').value.trim(),help=card.querySelector('select').value,error=card.querySelector('.form-error');if(!answer||!help){error.textContent=!answer?'先写下你的想法，再提交。':'请选择你得到的帮助。';error.classList.remove('hidden');(!answer?card.querySelector('textarea'):card.querySelector('select')).focus();return}m.answer=answer;m.help=help;m.submitted=true;card.outerHTML=practiceContent(m);const ws=state.workspace,ss=m.sourceIds.map(sid=>ws.sources.find(s=>s.id===sid)).filter(Boolean),first=ss[0];let title='你的想法已经记录',html='';if(m.topic==='algebra'){const related=/线性相关|(?<!无)相关/.test(answer),reason=/[+=＋＝]|之和|加|相加|非平凡/.test(answer);title=related&&reason?'你找到了关键关系':'再看一眼三个向量之间的关系';html=`<p>${related&&reason?'对，':'试着把前两个向量相加：'}<strong>v₁ + v₂ = (1, 3, 1) = v₃</strong>。因此这组向量线性相关，非平凡组合可以写成 v₁ + v₂ − v₃ = 0。${cite(ss.find(s=>s.id==='la-1')||first)}</p><p>依据：存在一组不全为 0 的系数，使线性组合等于零向量。${cite(ss.find(s=>s.id==='la-1')||first)}</p><p class="feedback-next"><strong>下一步</strong> · ${related&&reason?'如果只留下 v₁ 和 v₂，它们是否线性无关？试着说明理由。':'用自己的话解释：为什么发现一个这样的组合就能说明线性相关？'}</p>`}else if(m.topic==='binary'){title=/右|left|mid.*1/.test(answer)?'你抓住了缩小区间的方向':'从比较结果重新看一遍';html=`<p>中间值 5 小于目标 7，可以排除它和它左边的元素。闭区间写法里，令 left = mid + 1，接着搜索 [7, 9]。${cite(first)}</p><p class="feedback-next"><strong>下一步</strong> · 换成查找一个不存在的值，观察区间什么时候变为空。</p>`}else{html=`<p>可以把你的解释与来源中的这段话对照：${escapeHtml(first?.paragraphs[first.highlight]||ws.goal)}${cite(first)}</p><p class="feedback-next"><strong>下一步</strong> · 找出你的解释与原文一致的地方，再补一个具体例子。</p>`}appendMessage({id:uid('feedback'),type:'feedback',title,html});ws.lastConversation=state.conversation.id}
function askQuestion(question){const text=question.trim();if(!text)return;const c=state.conversation,ws=state.workspace;if(!c.messages.length){c.title=text.length>14?text.slice(0,14)+'…':text;$('#conversationTitle').textContent=c.title}appendMessage({id:uid('message'),type:'user',text});appendMessage({id:uid('message'),type:'ai',html:answerHtml(text)});if(/出一道题|练习/.test(text)&&selectedSources().length)appendMessage(createPractice());ws.lastConversation=c.id;$('#questionInput').value='';resizeQuestion()}
function resizeQuestion(){const input=$('#questionInput');input.style.height='auto';input.style.height=Math.min(input.scrollHeight,112)+'px'}
function showConversationMenu(){const menu=$('#conversationMenu'),open=menu.classList.contains('hidden');menu.innerHTML=state.workspace.conversations.map(c=>`<button data-switch-conversation="${c.id}" class="${c===state.conversation?'current':''}">${icon('chat','small-icon')}<span>${escapeHtml(c.title)}</span>${c===state.conversation?icon('check','small-icon'):''}</button>`).join('')+`<button class="menu-new" id="newConversation">${icon('plus','small-icon')}新建对话</button>`;menu.classList.toggle('hidden',!open);$('#conversationSwitch').setAttribute('aria-expanded',String(open));$('#newConversation').onclick=()=>{const c=newConversation();state.workspace.conversations.unshift(c);switchConversation(c.id)}}
function switchConversation(id){const ws=state.workspace,c=ws.conversations.find(item=>item.id===id);if(!c)return;state.conversation=c;ws.currentConversation=c.id;renderConversation();switchTab('pChat')}
function continueLearning(){const ws=state.workspace;let c=ws.conversations.find(item=>item.id===ws.lastConversation&&item.messages.length);if(!c)c=ws.conversations.find(item=>item.messages.length);if(c){switchConversation(c.id);notify('已回到上次的对话')}else startLearning()}

function guideContent(ws=state.workspace){const ss=selectedSources(ws);if(!ss.length)return `<p>${escapeHtml(ws.goal)}</p><p>添加来源后，可以围绕资料生成学习指南。</p>`;if(ws.topic==='algebra')return `<h3>先抓住三个关键词</h3><ul><li><strong>线性无关</strong>：只有全零系数的组合能得到零向量。${cite(ss.find(s=>s.id==='la-1')||ss[0],ws)}</li><li><strong>基</strong>：线性无关，并能张成整个空间。${cite(ss.find(s=>s.id==='la-2')||ss[0],ws)}</li><li><strong>秩</strong>：把向量排成矩阵，比较秩与向量的个数。${cite(ss.find(s=>s.id==='la-3')||ss[0],ws)}</li></ul><h3>容易混淆的地方</h3><p>两两不共线，不等于整组线性无关。判断三个向量时，要看三者之间有没有非平凡的线性组合。</p><h3>试着自己解释</h3><p>如果 v₃ = v₁ + v₂，为什么三个向量不能构成 R³ 的一组基？</p>`;return `<h3>学习方向</h3><p>${escapeHtml(ws.goal)}</p><h3>资料中的关键观点</h3><ul>${ss.map(s=>`<li>${escapeHtml(s.summary)}。${cite(s,ws)}</li>`).join('')}</ul><h3>试着自己解释</h3><p>挑选一个观点，用自己的话解释，再举一个具体的例子。</p>`}
function briefContent(){const ws=state.workspace;return `<h3>所选来源，一页读懂</h3>${selectedSources().map(s=>`<p>${escapeHtml(s.summary)}。${escapeHtml(s.paragraphs[s.highlight]||'')}${cite(s)}</p>`).join('')}<h3>可以带走的一个问题</h3><p>${escapeHtml(ws.goal)}</p>`}
function quizContent(){const ws=state.workspace;const questions=ws.topic==='algebra'?[{q:'R³ 中的 4 个向量一定线性相关吗？',options:['一定','不一定'],correct:0},{q:'下面哪组向量是 R² 的一组基？',options:['(1, 0) 与 (2, 0)','(1, 1) 与 (1, −1)'],correct:1}]:ws.topic==='binary'?[{q:'二分查找可以直接用于无序数组吗？',options:['可以','不可以'],correct:1},{q:'闭区间写法中，mid 的值小于目标时如何更新？',options:['left = mid + 1','right = mid − 1'],correct:0}]:ws.topic==='http'?[{q:'幂等性要求每次响应都完全一样吗？',options:['要求','不要求'],correct:1},{q:'幂等性主要关注什么？',options:['服务器上的预期效果','请求响应时间'],correct:0}]:[{q:'阅读资料后，怎样更好地检验自己的理解？',options:['用自己的话解释并举例','只记住原文的句子'],correct:0},{q:'概括一个观点时，应该怎样使用来源？',options:['保留依据，联系上下文','忽略依据只写结论'],correct:0}];return `<form id="quizForm">${questions.map((q,i)=>`<div class="quiz-question"><p>${i+1}. ${q.q}</p>${q.options.map((option,j)=>`<label><input type="radio" name="quiz-${i}" value="${j}" data-correct="${q.correct}" required>${option}</label>`).join('')}</div>`).join('')}<button type="submit" class="pill tonal">提交测验</button><div class="quiz-result hidden" id="quizResult" role="status"></div></form>`}
function renderStudio(){const ws=state.workspace;$('#studioList').innerHTML=ws.outputs.map(item=>`<button class="output" data-open-output="${item.id}"><span class="output-icon ${item.type}">${icon({guide:'study',quiz:'quiz',brief:'brief',note:'note'}[item.type])}</span><span class="output-info"><span class="output-title">${escapeHtml(item.title)}</span><small>${escapeHtml(item.meta)}</small></span>${icon('chevron','output-arrow')}</button>`).join('')}
function showStudioHome(){$('#studioHome').classList.remove('hidden');$('#studioViewer').classList.add('hidden')}
function openOutput(id){const output=state.workspace.outputs.find(item=>item.id===id);if(!output)return;$('#studioHome').classList.add('hidden');const viewer=$('#studioViewer');viewer.classList.remove('hidden');viewer.innerHTML=`<button class="back-button" id="backToStudio">${icon('left')}返回 Studio</button><h2>${escapeHtml(output.title)}</h2><div class="text-small muted">${escapeHtml(output.meta)}</div><div class="${output.type==='note'?'note-content':''}">${output.html}</div>${output.type==='note'?`<div class="viewer-actions"><button class="pill outline" data-edit-note="${output.id}">${icon('note','small-icon')}编辑笔记</button><button class="pill outline" data-note-to-source="${output.id}">${icon('source','small-icon')}转为来源</button></div>`:''}`;$('#backToStudio').onclick=showStudioHome;viewer.scrollTop=0;if(output.type==='quiz')$('#quizForm').onsubmit=e=>{e.preventDefault();const selected=$$('#quizForm input:checked'),right=selected.filter(item=>item.value===item.dataset.correct).length;$('#quizResult').textContent=`答对 ${right} / ${selected.length} 题。${right===selected.length?'可以回到对话，试试更有挑战的问题。':'回到资料中看看相关定义，再试一次。'}`;$('#quizResult').classList.remove('hidden')};if(matchMedia('(max-width:900px)').matches)switchTab('pStudio')}
function generateOutput(type){if(type==='note'){openNoteDialog();return}if(!selectedSources().length){notify('先选择或添加一个来源');return}const ws=state.workspace,names={guide:'学习指南',quiz:'测验',brief:'简报'},output={id:uid('output'),type,title:`${names[type]}：${ws.topic==='algebra'?'线性无关与基':ws.name}`,meta:`${selectedSources().length} 个来源 · 刚刚`,html:type==='guide'?guideContent():type==='quiz'?quizContent():briefContent()};ws.outputs.unshift(output);showStudioHome();renderStudio();notify(`${names[type]}已生成`)}
function saveMessage(id){const ws=state.workspace,m=ws.conversations.flatMap(c=>c.messages).find(item=>item.id===id);if(!m||state.noteSaved.has(id))return;const title=textOf(m.html).replace(/\s+/g,' ').trim().slice(0,19);ws.outputs.unshift({id:uid('note'),type:'note',title:'对话笔记：'+title,meta:'来自对话 · 刚刚',html:m.html});state.noteSaved.add(id);$$(`[data-save="${id}"]`).forEach(button=>{button.innerHTML=icon('check')+'已保存';button.disabled=true});showStudioHome();renderStudio();notify('已保存到 Studio 笔记')}
async function copyMessage(id){const ws=state.workspace,m=ws.conversations.flatMap(c=>c.messages).find(item=>item.id===id);if(!m)return;const text=textOf(m.html);try{await navigator.clipboard.writeText(text);notify('已复制')}catch{const field=document.createElement('textarea');field.value=text;field.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.append(field);field.select();const copied=document.execCommand('copy');field.remove();notify(copied?'已复制':'请选中正文进行复制')}}

function openCreateWorkspace(){openDialog('新建学习区',`<form id="createWorkspaceForm"><label class="form-label" for="createName">名称</label><input class="field" id="createName" placeholder="例如：我想弄懂的线性代数" maxlength="60" required><label class="form-label" for="createGoal">想学会什么</label><textarea class="field textarea" id="createGoal" rows="2" maxlength="200" placeholder="用一句话，说说你想学会什么" required></textarea><label class="form-check"><input type="checkbox" id="createWithSources">现在添加来源</label>${dialogFooter('createWorkspaceSubmit','创建学习区')}</form>`);$('#createWorkspaceForm').onsubmit=e=>{e.preventDefault();const ws={id:uid('workspace'),name:$('#createName').value.trim(),goal:$('#createGoal').value.trim(),emoji:'📓',color:'blue',date:'刚刚',topic:'custom',sources:[],isNew:true};if(!ws.name||!ws.goal)return;const withSources=$('#createWithSources').checked;workspaces.unshift(ws);closeDialog();openWorkspace(ws.id);if(withSources)openAddSource()}}
function openWorkspaceSettings(){const ws=state.workspace;openDialog('学习区设置',`<form id="workspaceSettingsForm"><label class="form-label" for="settingsName">学习区名称</label><input class="field" id="settingsName" value="${escapeHtml(ws.name)}" maxlength="60" required><label class="form-label" for="settingsGoal">学习方向</label><textarea class="field textarea" id="settingsGoal" rows="3" maxlength="200" required>${escapeHtml(ws.goal)}</textarea>${dialogFooter('saveSettings','保存设置')}</form>`);$('#workspaceSettingsForm').onsubmit=e=>{e.preventDefault();const name=$('#settingsName').value.trim(),goal=$('#settingsGoal').value.trim();if(!name||!goal)return;ws.name=name;ws.goal=goal;$('#workspaceTitle').textContent=name;closeDialog();if(!state.conversation.messages.length)renderConversation();notify('学习区设置已保存')}}
function openNoteDialog(id){const ws=state.workspace,existing=ws.outputs.find(item=>item.id===id);openDialog(existing?'编辑笔记':'添加笔记',`<form id="noteForm"><label class="form-label" for="noteTitle">笔记标题</label><input class="field" id="noteTitle" maxlength="80" placeholder="给这条笔记起个名字" value="${existing?escapeHtml(existing.title):''}" required><label class="form-label" for="noteBody">笔记内容</label><textarea class="field textarea" rows="7" id="noteBody" placeholder="用自己的话，写下你的理解…" required>${existing?escapeHtml(textOf(existing.html)):''}</textarea>${dialogFooter('saveNote','保存笔记')}</form>`);$('#noteForm').onsubmit=e=>{e.preventDefault();const title=$('#noteTitle').value.trim(),body=$('#noteBody').value.trim();if(!title||!body)return;const html=`<div class="note-content">${escapeHtml(body)}</div>`;if(existing){existing.title=title;existing.html=html;existing.meta='笔记 · 刚刚'}else ws.outputs.unshift({id:uid('note'),type:'note',title,html,meta:'笔记 · 刚刚'});closeDialog();renderStudio();if(existing)openOutput(existing.id);else showStudioHome();notify('笔记已保存')}}
let sourcePane='pdf',pdfFile=null;
function openAddSource(){sourcePane='pdf';pdfFile=null;openDialog('添加来源',`<div class="dialog-tabs" role="tablist" aria-label="来源类型">${[['pdf','source','PDF'],['text','note','文本'],['url','link','网址'],['search','search','搜索发现']].map(([key,name,label])=>`<button type="button" role="tab" data-source-pane="${key}" aria-selected="${key==='pdf'}">${icon(name)}${label}</button>`).join('')}</div><form id="addSourceForm"><div id="sourcePane"></div><div class="dialog-error hidden" id="sourceError" role="status"></div>${dialogFooter('confirmSource','添加')}</form>`);renderSourcePane();$('#addSourceForm').onsubmit=e=>{e.preventDefault();addSourceFromDialog()}}
function renderSourcePane(){const pane=$('#sourcePane');$$('[data-source-pane]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.sourcePane===sourcePane)));$('#sourceError').classList.add('hidden');const topic=state.workspace.topic==='algebra'?'线性无关与基':state.workspace.name;const query=escapeHtml(topic);if(sourcePane==='pdf'){pane.innerHTML=`<input type="file" id="pdfInput" accept=".pdf,application/pdf" class="hidden" aria-label="选择 PDF 文件"><button type="button" class="upload-zone" id="uploadZone">${icon('upload')}<strong id="pdfFileName">选择 PDF 文件</strong><span>或将文件拖到这里</span></button>`;if(pdfFile)$('#pdfFileName').textContent=pdfFile.name;$('#uploadZone').onclick=()=>$('#pdfInput').click();$('#pdfInput').onchange=e=>{pdfFile=e.target.files[0]||null;$('#pdfFileName').textContent=pdfFile?pdfFile.name:'选择 PDF 文件'};$('#uploadZone').ondragover=e=>{e.preventDefault();e.currentTarget.style.background='#edf2fd'};$('#uploadZone').ondragleave=e=>e.currentTarget.style.background='';$('#uploadZone').ondrop=e=>{e.preventDefault();e.currentTarget.style.background='';const file=e.dataTransfer.files[0];if(file&&(file.type==='application/pdf'||/\.pdf$/i.test(file.name))){pdfFile=file;$('#pdfFileName').textContent=file.name}else showSourceError('请选择 PDF 文件')}}else if(sourcePane==='text'){pane.innerHTML='<label class="form-label" for="textSourceTitle">来源标题</label><input class="field" id="textSourceTitle" placeholder="例如：我的阅读笔记" maxlength="100" required><label class="form-label" for="textSourceBody">文本正文</label><textarea class="field textarea" id="textSourceBody" rows="6" placeholder="粘贴或输入正文…" required></textarea>'}else if(sourcePane==='url'){pane.innerHTML='<label class="form-label" for="sourceUrl">网址</label><input class="field" type="url" id="sourceUrl" placeholder="https://…" required>'}else{pane.innerHTML=`<label class="form-label" for="searchKeywords">搜索关键词</label><div class="search-row"><input class="field" id="searchKeywords" value="${query}" placeholder="搜索你想弄懂的主题"><button class="pill tonal" type="button" id="searchSources">搜索</button></div><div class="search-results" id="searchResults"></div>`;renderSearchResults();$('#searchSources').onclick=()=>{renderSearchResults();notify('已更新搜索结果')}}}
function renderSearchResults(){const query=$('#searchKeywords').value.trim()||state.workspace.name;$('#searchResults').innerHTML=[{title:state.workspace.topic==='algebra'?'MIT 18.06：Independence, Basis, Dimension':`${query}：入门讲义`,domain:'ocw.mit.edu',checked:true},{title:state.workspace.topic==='algebra'?'Linear independence：定义与例子':`${query}：概念与例子`,domain:'学习资料精选',checked:false},{title:`${query}：学习笔记与练习`,domain:'学习笔记',checked:false}].map((item,i)=>`<label class="search-result"><input type="checkbox" data-search-result="${i}" data-title="${escapeHtml(item.title)}" ${item.checked?'checked':''}><span><strong>${escapeHtml(item.title)}</strong><small>${item.domain}</small></span></label>`).join('')}

function makeDemoSource(title,type,status){const ws=state.workspace;const paragraphs=ws.topic==='algebra'?['线性无关与基：概念和例子','一组向量线性无关，意味着零向量的线性组合只有所有系数为零这一种解。','构成基还需要能够张成整个空间。可以从“方向是否多余”以及“能否表达任意向量”两个角度理解。']:[`${ws.name}：学习材料`,ws.goal,'先概括主要观点，再联系具体的例子，可以帮助检验你对资料的理解。'];return source(uid('source'),title,type,status,type==='pdf'?'PDF · 第 1 页':type==='web'?'网页 · 正文片段':'学习材料 · 第 1 节',paragraphs,1,`${title}围绕“${ws.goal}”展开`)}
function addSourceFromDialog(){const ws=state.workspace;let additions=[];if(sourcePane==='pdf'){if(!pdfFile){showSourceError('请先选择一个 PDF 文件。');return}additions=[makeDemoSource(pdfFile.name,'pdf','已解析')]}else if(sourcePane==='text'){const title=$('#textSourceTitle').value.trim(),text=$('#textSourceBody').value.trim();if(!title||!text){showSourceError('请输入标题与正文。');return}const paragraphs=text.split(/\n\s*\n|\n/).map(p=>p.trim()).filter(Boolean);additions=[source(uid('source'),title,'text','已解析','文本 · 第 1 段',paragraphs,0,text.slice(0,90))]}else if(sourcePane==='url'){const value=$('#sourceUrl').value.trim();let url;try{url=new URL(value)}catch{showSourceError('请输入完整的网址。');return}if(!['https:','http:'].includes(url.protocol)){showSourceError('请输入 http 或 https 网址。');return}additions=[makeDemoSource(url.hostname+url.pathname,'web','部分正文')]}else{const selected=$$('[data-search-result]:checked');if(!selected.length){showSourceError('请选择至少一个搜索结果。');return}additions=selected.map(item=>makeDemoSource(item.dataset.title,'search','已采纳'))}ws.sources.push(...additions);closeDialog();renderSources();notify(`已添加 ${additions.length} 个来源`)}

function openDrawer(){$('#drawer').classList.remove('hidden');$('#drawerScrim').classList.remove('hidden');$('#closeDrawer').focus()}
function closeDrawer(){$('#drawer').classList.add('hidden');$('#drawerScrim').classList.add('hidden')}
function openNav(key){closeDrawer();if(key==='home'){showHome();return}const titles=Object.fromEntries(navItems.map(([id,,title])=>[id,title]));const views={progress:`<div class="info-copy">线性无关与基 · 学习进度 42%</div><div class="info-progress"><span></span></div><div class="info-row"><span>回顾：线性无关的定义</span><small>今天</small></div><div class="info-row"><span>练习：判断一组基</span><small>今天</small></div><div class="info-row"><span>复习：矩阵的秩</span><small>明天</small></div>`,history:`<div class="info-row"><span>线性无关与基</span><small>今天 · 6 条消息</small></div><div class="info-row"><span>基与维数</span><small>昨天 · 2 条消息</small></div><button class="pill tonal" id="historyContinue">继续上次对话</button>`,memory:'<div class="info-row"><span>偏好的讲解方式</span><small>先直观，再给定义</small></div><div class="info-row"><span>最近的学习重点</span><small>线性无关与基</small></div>',tasks:'<div class="info-row"><span>整理二分查找资料</span><small>处理中</small></div><div class="info-row"><span>生成线性代数学习指南</span><small>已完成</small></div>',structure:'<div class="info-row"><span>向量 → 线性组合 → 线性无关</span></div><div class="info-row"><span>线性无关 + 张成空间 → 基 → 维数</span></div><div class="info-row"><span>矩阵 → 秩 → 独立列的个数</span></div>',sync:'<div class="info-row"><span>我的课堂笔记</span><small>已同步 · 今天 09:30</small></div><div class="info-row"><span>阅读摘录</span><small>已同步 · 昨天</small></div>',offline:'<div class="info-row"><span>线性代数入门</span><small>可离线阅读</small></div><div class="info-row"><span>二分查找与边界</span><small>可离线阅读</small></div>',settings:'<div class="info-row"><span>讲解语言</span><small>简体中文</small></div><div class="info-row"><span>回答偏好</span><small>简洁，带例子与引用</small></div><div class="info-row"><span>搜索发现</span><small>已开启</small></div>',devices:'<div class="info-row"><span>我的电脑</span><small>当前设备</small></div><div class="info-row"><span>手机</span><small>最近活跃 · 今天</small></div><div class="info-row"><span>数据保留</span><small>来源、对话与笔记</small></div>'};openDialog(titles[key],views[key]+`<div class="dialog-footer"><button class="pill outline" data-close-dialog>关闭</button></div>`);if(key==='history')$('#historyContinue').onclick=()=>{closeDialog();if(!state.workspace)openWorkspace('algebra');else if($('#workspace').classList.contains('hidden'))openWorkspace(state.workspace.id);continueLearning()}}
/* Event delegation keeps dynamic messages and references interactive. */
document.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.hasAttribute('data-close-dialog')){closeDialog();return}if(target.dataset.openWorkspace){openWorkspace(target.dataset.openWorkspace);return}if(target.dataset.source){openSource(target.dataset.source);return}if(target.dataset.cite){if(state.workspace&&target.dataset.workspace===state.workspace.id)openSource(target.dataset.cite);return}if(target.dataset.question){askQuestion(target.dataset.question);return}if(target.dataset.ask){askQuestion(target.dataset.ask);return}if(target.dataset.submitPractice){submitPractice(target.dataset.submitPractice);return}if(target.dataset.save){saveMessage(target.dataset.save);return}if(target.dataset.copy){copyMessage(target.dataset.copy);return}if(target.dataset.switchConversation){switchConversation(target.dataset.switchConversation);return}if(target.dataset.generate){generateOutput(target.dataset.generate);return}if(target.dataset.openOutput){openOutput(target.dataset.openOutput);return}if(target.dataset.editNote){openNoteDialog(target.dataset.editNote);return}if(target.dataset.noteToSource){const output=state.workspace.outputs.find(o=>o.id===target.dataset.noteToSource),text=textOf(output.html);state.workspace.sources.push(source(uid('source'),output.title,'text','已解析','笔记 · 第 1 段',[text],0,text.slice(0,90)));renderSources();notify('笔记已添加为来源');return}if(target.dataset.sourcePane){sourcePane=target.dataset.sourcePane;renderSourcePane();return}if(target.dataset.tab){switchTab(target.dataset.tab);return}if(target.dataset.nav){openNav(target.dataset.nav);return}if(target.id==='startLearning')startLearning();if(target.id==='continueLearning')continueLearning()});
document.addEventListener('click',event=>{if(!event.target.closest('#conversationMenu')&&!event.target.closest('#conversationSwitch')){$('#conversationMenu').classList.add('hidden');$('#conversationSwitch').setAttribute('aria-expanded','false')}});
document.addEventListener('change',event=>{const id=event.target.dataset.selectSource;if(id){const s=state.workspace.sources.find(item=>item.id===id);s.selected=event.target.checked;updateSourceCount()}});
document.addEventListener('input',event=>{const card=event.target.closest('[data-practice-id]');if(card){const m=state.conversation.messages.find(item=>item.id===card.dataset.practiceId);if(!m.submitted){m.answer=card.querySelector('textarea').value;m.help=card.querySelector('select').value}}});
document.addEventListener('keydown',event=>{if(event.isComposing)return;if(event.key==='Escape'){closeDrawer();$('#conversationMenu').classList.add('hidden');$('#conversationSwitch').setAttribute('aria-expanded','false')}if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){const card=event.target.closest('[data-practice-id]');if(card){event.preventDefault();submitPractice(card.dataset.practiceId)}}});
$('#allSources').onchange=event=>{state.workspace.sources.forEach(s=>s.selected=event.target.checked);renderSources()};
$('#homeButton').onclick=showHome;$('#newWorkspace').onclick=openCreateWorkspace;$('#workspaceSettings').onclick=openWorkspaceSettings;$('#addSource').onclick=openAddSource;$('#addNote').onclick=()=>openNoteDialog();$('#menuButton').onclick=openDrawer;$('#closeDrawer').onclick=closeDrawer;$('#drawerScrim').onclick=closeDrawer;$('#conversationSwitch').onclick=showConversationMenu;
$('#sendQuestion').onclick=()=>{askQuestion($('#questionInput').value);$('#questionInput').focus()};$('#questionInput').oninput=resizeQuestion;$('#questionInput').onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('#sendQuestion').click()}};
$('#dialog').onclick=event=>{if(event.target!==$('#dialog'))return;const rect=$('#dialog').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeDialog()};
$('#gridView').onclick=()=>{$('#workspaceGrid').classList.remove('list-view');$('#gridView').classList.add('active');$('#listView').classList.remove('active')};$('#listView').onclick=()=>{$('#workspaceGrid').classList.add('list-view');$('#listView').classList.add('active');$('#gridView').classList.remove('active')};
let alphabetical=false;$('#sortWorkspaces').onclick=()=>{alphabetical=!alphabetical;workspaces.sort((a,b)=>alphabetical?a.name.localeCompare(b.name,'zh-CN'):a.id==='algebra'?-1:b.id==='algebra'?1:0);$('#sortWorkspaces').innerHTML=(alphabetical?'按名称':'最近打开')+icon('chevron','small-icon');renderHome()};
renderDrawer();renderHome();
</script>
</body>
</html>
