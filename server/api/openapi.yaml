          description: Current record metadata page without cached remote content.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MemoryRecordPage" } },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MemoryConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/memory/records/{memoryID}:
    get:
      operationId: getMemoryRecord
      summary: Read current record metadata with live remote content availability
      x-required-scope: memory:read
      security: [{ deviceBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/LogicalMemoryID"
      responses:
        "200":
          description: Current metadata plus live content status; content is present only after a current Nocturne hash match.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MemoryRecordView" } },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    delete:
      operationId: deleteMemoryRecord
      summary: Tombstone a logical memory and queue verified remote deletion
      x-required-scope: memory:write
      x-max-body-bytes: 1048576
      security: [{ deviceBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/LogicalMemoryID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryDeleteRequest" }
      responses:
        "200":
          description: Delete already reached a public terminal state or was replayed.
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/MemoryOperationResult" },
                },
            }
        "202":
          description: Delete intent is durably queued.
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/MemoryOperationResult" },
                },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MemoryConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/memory/records/{memoryID}/candidates:
    post:
      operationId: createMemoryCorrectionCandidate
      summary: Propose a correction candidate for the current record revision
      x-required-scope: memory:write
      x-max-body-bytes: 1048576
      security: [{ deviceBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/LogicalMemoryID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/MemoryCorrectionCandidateRequest" }
      responses:
        "200":
          description: Idempotent replay.
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/MemoryOperationResult" },
                },
            }
        "201":
          description: Correction candidate created; the endpoint never writes a record revision directly.
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/MemoryOperationResult" },
                },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MemoryConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/memory/export:
    get:
      operationId: exportMemoryRecords
      summary: Export record metadata with live remote content availability
      x-required-scope: memory:read
      security: [{ deviceBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Typed export without credentials, raw upstream responses, attempt tokens, or leases.
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/MemoryExportPage" } },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MemoryConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/memory/deliveries/{deliveryID}/replays:
    post:
      operationId: replayMemoryDelivery
      summary: Requeue one eligible dead-letter memory delivery
      x-required-scope: memory:write
      x-max-body-bytes: 1048576
      security: [{ deviceBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/MemoryDeliveryID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryReplayRequest" }
      responses:
        "200":
          description: Replay is terminal or idempotently returned.
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/MemoryOperationResult" },
                },
            }
        "202":
          description: Replay is durably queued.
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/MemoryOperationResult" },
                },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MemoryConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/privacy/erasures:
    post:
      operationId: createPrivacyErasure
      summary: Commit and advance a globally fenced privacy erasure
      description: A paired-device credential does not carry privacy:erase by default. For a new operation, a valid device-bound X-Privacy-Erasure-Grant is consumed atomically with the serializable barrier transaction and gives only this request the effective privacy:erase scope represented by x-required-scope. An exact replay of an already committed operation may omit the grant and returns the existing receipt.
      x-required-scope: privacy:erase
      x-required-erasure-grant: true
      x-effective-scope-source: privacyErasureGrant
      x-max-body-bytes: 1048576
      security:
        - deviceBearer: []
          privacyErasureGrant: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyErasureRequest" }
      responses:
        "202":
          description: Barrier committed and follow-up local or remote work applied or durably pending.
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/PrivacyErasureReceipt" },
                },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PrivacyConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/privacy/erasures/{erasureID}:
    get:
      operationId: getPrivacyErasureReceipt
      summary: Read the current append-only erasure receipt summary
      x-required-scope: privacy:read
      security: [{ deviceBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/PrivacyErasureID"
      responses:
        "200":
          description: Current receipt summary with managed and unsupported locations kept distinct.
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/PrivacyErasureReceipt" },
                },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PrivacyConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
components:
  parameters:
    KnowledgeRevisionID:
      name: revisionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionID:
      name: sessionID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/LearningUUID" }
    AssessmentID:
      name: assessmentID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/LearningUUID" }
    NodeRevisionID:
      name: nodeRevisionID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/LearningUUID" }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque generation-bound cursor. A stale generation returns 409.
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    DueBefore:
      name: due_before
      in: query
      schema: { type: string, format: date-time }
    MemoryCandidateID:
      name: candidateID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/MemoryUUID" }
    LogicalMemoryID:
      name: memoryID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/MemoryUUID" }
    MemoryDeliveryID:
      name: deliveryID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/MemoryUUID" }
    PrivacyErasureID:
      name: erasureID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/MemoryUUID" }
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-token
      description: Paired-device credential. The default credential scopes do not include privacy:erase; that effective scope exists only for an authorized erasure request.
    privacyErasureGrant:
      type: apiKey
      in: header
      name: X-Privacy-Erasure-Grant
      description: One-time, device-bound, locally issued privacy erasure grant. For a new operation it is validated and consumed in the same serializable transaction as the barrier; a failed or conflicting barrier does not consume it. An exact committed-operation replay may omit it. The value is never returned or logged.
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PairingFailed:
      description: Pairing failed without revealing whether a lookup ID exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Device authentication failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The device lacks the required scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: Request body or a Markdown document exceeds a frozen limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Markdown envelope, AST, or identity marker validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: The request failed because of an internal service or dependency error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: The client or IP exceeded a failure/attempt limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LearningGoalConflict:
      description: Goal idempotency or expected-version conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LearningGoalConflict" }
    TutoringSessionConflict:
      description: Session creation idempotency or expected-version conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TutoringSessionConflict" }
    TutoringProposalConflict:
      description: Proposal idempotency or frozen-context conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TutoringProposalConflict" }
    TutoringActionConflict:
      description: Session action idempotency, version, state, proposal, disposition, or focus-frame conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TutoringActionConflict" }
    AssessmentDecisionConflict:
      description: Assessment decision idempotency, session version, state, or disposition conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AssessmentDecisionConflict" }
    LearningCursorConflict:
      description: The projection cursor belongs to a stale generation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LearningCursorConflict" }
    DependencyUnavailable:
      description: Model, projection, memory, privacy, or response read permit is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MemoryConflict:
      description: Idempotency, candidate revision, record generation, delivery state, or cursor conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MemoryErrorEnvelope"
    PrivacyConflict:
      description: An erasure operation, expected learner generation, or receipt head conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    LearningUUID:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    LearningOperationInput:
      type: object
      additionalProperties: false
      required:
        [
          operation_id,
          payload_schema_version,
          aggregate_type,
          aggregate_id,
          expected_version,
        ]
      properties:
        operation_id: { $ref: "#/components/schemas/LearningUUID" }
        payload_schema_version: { type: integer, const: 1 }
        aggregate_type: { type: string, enum: [goal, session] }
        aggregate_id: { $ref: "#/components/schemas/LearningUUID" }
        expected_version: { type: integer, minimum: 0 }
        occurred_at: { type: string, format: date-time }
    LearningGoalRequest:
      type: object
      additionalProperties: false
      required:
        [
          operation_id,
          payload_schema_version,
          aggregate_type,
          aggregate_id,
          expected_version,
          text,
          source,
        ]
      properties:
        operation_id: { $ref: "#/components/schemas/LearningUUID" }
        payload_schema_version: { type: integer, const: 1 }
        aggregate_type: { const: goal }
        aggregate_id: { $ref: "#/components/schemas/LearningUUID" }
        expected_version: { type: integer, minimum: 0 }
        occurred_at: { type: string, format: date-time }
        goal_id: { $ref: "#/components/schemas/LearningUUID" }
        text: { type: string, minLength: 1, maxLength: 4000 }
        source:
          type: string
          minLength: 1
          maxLength: 200
          x-max-utf8-bytes: 200
          description: Nonblank valid UTF-8 limited to 200 encoded bytes.
        previous_revision_id: { $ref: "#/components/schemas/LearningUUID" }
    TutoringSessionRequest:
      type: object
      additionalProperties: false
      required:
        [
          operation_id,
          payload_schema_version,
          aggregate_type,
          aggregate_id,
          expected_version,
          goal_revision_id,
        ]
      properties:
        operation_id: { $ref: "#/components/schemas/LearningUUID" }
        payload_schema_version: { type: integer, const: 1 }
        aggregate_type: { const: session }
        aggregate_id: { $ref: "#/components/schemas/LearningUUID" }
        expected_version: { const: 0 }
        occurred_at: { type: string, format: date-time }
        goal_revision_id: { $ref: "#/components/schemas/LearningUUID" }
    TutoringProposalRequest:
      type: object
      additionalProperties: false
      required:
        [
          request_id,
          proposal_type,
          aggregate_type,
          aggregate_id,
          aggregate_version,
          knowledge_revision_id,
          node_revision_ids,
          input,
        ]
      properties:
        request_id: { $ref: "#/components/schemas/LearningUUID" }
        proposal_type: { $ref: "#/components/schemas/ProposalType" }
        aggregate_type: { type: string, enum: [goal, session] }
        aggregate_id: { $ref: "#/components/schemas/LearningUUID" }
        aggregate_version: { type: integer, minimum: 0 }
        goal_revision_id: { $ref: "#/components/schemas/LearningUUID" }
        route_revision_id: { $ref: "#/components/schemas/LearningUUID" }
        route_step_id: { $ref: "#/components/schemas/LearningUUID" }
        focus_node_revision_id: { $ref: "#/components/schemas/LearningUUID" }
        activity_id: { $ref: "#/components/schemas/LearningUUID" }
        attempt_id: { $ref: "#/components/schemas/LearningUUID" }
        free_question_id: { $ref: "#/components/schemas/LearningUUID" }
        free_answer_id: { $ref: "#/components/schemas/LearningUUID" }
        focus_frame_id: { $ref: "#/components/schemas/LearningUUID" }
        tutoring_state: { $ref: "#/components/schemas/TutoringState" }
        knowledge_revision_id: { $ref: "#/components/schemas/LearningUUID" }
        node_revision_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/LearningUUID" }
        input:
          type: object
          additionalProperties: {}
