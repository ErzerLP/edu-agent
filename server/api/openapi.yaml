openapi: 3.1.0
info:
  title: Edu Agent Knowledge API
  version: 0.2.0
  description: HTTP contract for platform identity, model capability inspection, and immutable canonical knowledge revisions.
servers:
  - url: http://127.0.0.1:8080
paths:
  /livez:
    get:
      operationId: getLiveness
      summary: Check process liveness
      responses:
        "200":
          description: The process event loop is responding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /readyz:
    get:
      operationId: getReadiness
      summary: Check required and optional dependencies
      responses:
        "200":
          description: Required dependencies are ready; optional dependencies may be degraded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: A required dependency is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /v1/pairings/exchange:
    post:
      operationId: exchangePairingCode
      summary: Exchange a short-lived one-time pairing code for a device token
      description: Pairing codes can only be created by the local `edu-agentd pairing-code create` command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingExchangeRequest"
      responses:
        "201":
          description: Device credential issued. The plaintext token appears in this response only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/PairingFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/devices:
    get:
      operationId: listDevices
      summary: List paired devices
      x-required-scope: devices:read
      security:
        - deviceBearer: []
      responses:
        "200":
          description: Paired devices without credential hashes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/devices/{deviceID}:
    delete:
      operationId: revokeDevice
      summary: Revoke a device and all of its tokens
      x-required-scope: devices:manage
      security:
        - deviceBearer: []
      parameters:
        - name: deviceID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Device credentials were revoked immediately.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/model/capabilities:
    get:
      operationId: probeModelCapabilities
      summary: Probe the configured OpenAI-compatible Chat Completions profile
      x-required-scope: model:probe
      security:
        - deviceBearer: []
      responses:
        "200":
          description: Capability result, including explicit incompatibility reasons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCapabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/knowledge/revisions/head:
    get:
      operationId: getKnowledgeHead
      summary: Read the current frozen knowledge revision
      x-required-scope: knowledge:read
      security:
        - deviceBearer: []
      responses:
        "200":
          description: Current immutable knowledge revision.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revision]
                properties:
                  revision:
                    $ref: "#/components/schemas/KnowledgeRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /v1/knowledge/imports:
    post:
      operationId: importKnowledgeDocuments
      summary: Atomically upsert Markdown documents into a new complete snapshot
      x-required-scope: knowledge:write
      security:
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeImportRequest"
      responses:
        "200":
          description: Idempotent replay or unchanged manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeImportResult"
        "201":
          description: A new immutable revision was committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Revision, idempotency, path, or identity review conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /v1/knowledge/revisions/{revisionID}/tree:
    get:
      operationId: getKnowledgeRevisionTree
      summary: Read the deterministic document and node tree for a revision
      x-required-scope: knowledge:read
      security:
        - deviceBearer: []
      parameters:
        - $ref: "#/components/parameters/KnowledgeRevisionID"
      responses:
        "200":
          description: Complete revision tree.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revision]
                properties:
                  revision:
                    $ref: "#/components/schemas/KnowledgeRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /v1/knowledge/revisions/{revisionID}/export:
    get:
      operationId: exportKnowledgeRevision
      summary: Export an immutable revision as sorted Obsidian-readable Markdown documents
      x-required-scope: knowledge:read
      security:
        - deviceBearer: []
      parameters:
        - $ref: "#/components/parameters/KnowledgeRevisionID"
      responses:
        "200":
          description: Sorted Markdown export with source revision metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeExport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /v1/knowledge/retrievals:
    post:
      operationId: retrieveKnowledge
      summary: Run deterministic hierarchical retrieval against one frozen revision
      x-required-scope: knowledge:read
      security:
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeRetrievalRequest"
      responses:
        "200":
          description: Candidate trace and canonical hits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeRetrievalResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /v1/learning/goals:
    post:
      operationId: createLearningGoal
      summary: Create an immutable learning goal revision
      x-required-scope: learning:write
      x-max-body-bytes: 1048576
      security: [{ deviceBearer: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/LearningGoalRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Idempotent replay.,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/GoalOperationResult" },
                  },
              },
          }
        "201":
          {
            description: Goal committed.,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/GoalOperationResult" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/LearningGoalConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/tutoring/sessions:
    post:
      operationId: createTutoringSession
      summary: Create a tutoring session
      x-required-scope: learning:write
      x-max-body-bytes: 1048576
      security: [{ deviceBearer: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/TutoringSessionRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Idempotent replay.,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/SessionOperationResult" },
                  },
              },
          }
        "201":
          {
            description: Session committed.,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/SessionOperationResult" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TutoringSessionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/tutoring/proposals:
    post:
      operationId: proposeTutoringArtifact
      summary: Generate and durably freeze a model proposal without mutating an aggregate
      x-required-scope: learning:write
      x-max-body-bytes: 1048576
      security: [{ deviceBearer: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/TutoringProposalRequest" },
                },
            },
        }
      responses:
        "201":
          {
            description: Durable frozen proposal.,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/TutoringProposal" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TutoringProposalConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/tutoring/sessions/{sessionID}/actions:
    post:
      operationId: applyTutoringAction
      summary: Apply one state-machine action to a tutoring session
      x-required-scope: learning:write
      x-max-body-bytes: 1048576
      security: [{ deviceBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionID" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/TutoringActionRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Idempotent replay.,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/SessionOperationResult" },
                  },
              },
          }
        "201":
          {
            description: Action committed.,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/SessionOperationResult" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/TutoringActionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/learning/assessments/{assessmentID}/decisions:
    post:
      operationId: decideLearningAssessment
      summary: Compensate an assessment disposition and its evidence
      x-required-scope: learning:write
      x-max-body-bytes: 1048576
      security: [{ deviceBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/AssessmentID" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/AssessmentDecisionRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Idempotent replay.,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/AssessmentDecisionOperationResult" },
                  },
              },
          }
        "201":
          {
            description: Decision committed.,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/AssessmentDecisionOperationResult" },
                  },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AssessmentDecisionConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/tutoring/sessions/current:
    get:
      operationId: getCurrentTutoringSession
      summary: Read the current active tutoring session
      x-required-scope: learning:read
      security: [{ deviceBearer: [] }]
      responses:
        "200":
          {
            description: Current session.,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SessionView" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/tutoring/sessions/{sessionID}:
    get:
      operationId: getTutoringSession
      summary: Read one tutoring session
      x-required-scope: learning:read
      security: [{ deviceBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/SessionID" }]
      responses:
        "200":
          {
            description: Session read model.,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/SessionView" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/learning/timeline:
    get:
      operationId: listLearningTimeline
      summary: Read event-ordered learning timeline items
      x-required-scope: learning:read
      security: [{ deviceBearer: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/PageLimit" },
          {
            name: session_id,
            in: query,
            schema: { $ref: "#/components/schemas/LearningUUID" },
          },
        ]
      responses:
        "200":
          description: Event-ordered timeline page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelinePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/LearningCursorConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/learning/routes:
    get:
      operationId: listLearningRoutes
      summary: Read immutable route revisions
      x-required-scope: learning:read
      security: [{ deviceBearer: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/PageLimit" },
          {
            name: current_only,
            in: query,
            schema: { type: boolean, default: false },
          },
        ]
      responses:
        "200":
          description: Immutable route revision page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutesPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/LearningCursorConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/learning/nodes/{nodeRevisionID}:
    get:
      operationId: getLearningNode
      summary: Read mastery and misconception reduction for a node revision
      x-required-scope: learning:read
      security: [{ deviceBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/NodeRevisionID" }]
      responses:
        "200":
          {
            description: Node read model.,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/NodeView" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/learning/evidence:
    get:
      operationId: listLearningEvidence
      summary: Read accepted immutable evidence
      x-required-scope: learning:read
      security: [{ deviceBearer: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/PageLimit" },
          {
            name: node_revision_id,
            in: query,
            schema: { $ref: "#/components/schemas/LearningUUID" },
          },
        ]
      responses:
        "200":
          description: Accepted evidence page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidencePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/LearningCursorConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/learning/reviews:
    get:
      operationId: listLearningReviews
      summary: Read deterministic review schedule
      x-required-scope: learning:read
      security: [{ deviceBearer: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/PageLimit" },
          { $ref: "#/components/parameters/DueBefore" },
        ]
      responses:
        "200":
          description: Deterministic review schedule page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewsPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/LearningCursorConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/learning/projections/status:
    get:
      operationId: getLearningProjectionStatus
      summary: Read projection generation and checkpoint status
      x-required-scope: learning:read
      security: [{ deviceBearer: [] }]
      responses:
        "200":
          {
            description: Projection status.,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ProjectionStatus" } },
              },
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/memory/candidates:
    post:
      operationId: createMemoryCandidate
      summary: Propose an explicit user-stated memory candidate
      x-required-scope: memory:write
      x-max-body-bytes: 1048576
      security: [{ deviceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryCandidateRequest" }
      responses:
        "200":
          description: Idempotent replay.
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/MemoryOperationResult" },
                },
            }
        "201":
          description: Candidate created; an automatically admitted candidate may include a durable delivery status.
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/MemoryOperationResult" },
                },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
