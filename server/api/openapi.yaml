        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
    get:
      operationId: listMemoryCandidates
      summary: List memory candidates using a stable opaque cursor
      x-required-scope: memory:read
      security: [{ deviceBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Candidate page. Pending candidates may include reviewable proposed content.
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/MemoryCandidatePage" },
                },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/MemoryConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/memory/candidates/{candidateID}:
