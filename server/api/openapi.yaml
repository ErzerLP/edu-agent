        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/memory/candidates/{candidateID}/decisions:
    post:
      operationId: decideMemoryCandidate
      summary: Admit or reject a pending memory candidate using expected revision
      x-required-scope: memory:write
      x-max-body-bytes: 1048576
      security: [{ deviceBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/MemoryCandidateID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/MemoryCandidateDecisionRequest" }
      responses:
        "200":
          description: Decision committed or idempotently replayed.
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "#/components/schemas/MemoryOperationResult" },
                },
            }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MemoryConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DependencyUnavailable" }
  /v1/memory/records:
    get:
      operationId: listMemoryRecords
      summary: List current memory record metadata
      x-required-scope: memory:read
      security: [{ deviceBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
